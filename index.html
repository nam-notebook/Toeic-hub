  <style>
    :root {
      --bg-ivory: #f8f5ee;
      --bg-card: #fffdf9;
      --bg-warm: #f1ece1;
      --ink-slate: #182026;
      --ink-muted: #5c6670;
      --border-soft: rgba(24, 32, 38, 0.11);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background-color: var(--bg-ivory);
      color: var(--ink-slate);
    }

    .font-display {
      font-family: 'Cinzel', Georgia, serif;
    }

    .tlh-card {
      background: var(--bg-card);
      border: 1px solid var(--border-soft);
      border-radius: 1rem;
      box-shadow: 0 4px 20px rgba(24, 32, 38, 0.04);
    }

    .tlh-card-warm {
      background: var(--bg-warm);
      border: 1px solid var(--border-soft);
      border-radius: 0.875rem;
    }

    .gw-stage-frame {
      position: relative;
      width: 100%;
      height: 100%;
      min-height: 360px;
      border-radius: 1rem;
      overflow: hidden;
      background: #142022;
      box-shadow:
        0 18px 40px rgba(15, 23, 28, 0.18),
        inset 0 0 0 1px rgba(255, 248, 226, 0.16);
      user-select: none;
    }

    .gw-thumb-frame {
      position: relative;
      width: 100%;
      height: 100%;
      min-height: 78px;
      border-radius: 0.75rem;
      overflow: hidden;
      background: #142022;
      box-shadow: inset 0 0 0 1px rgba(255, 248, 226, 0.14);
    }

    .gw-canvas {
      display: block;
      width: 100%;
      height: 100%;
      cursor: grab;
      touch-action: none;
    }

    .gw-canvas.is-hovering {
      cursor: pointer;
    }

    .gw-canvas:active {
      cursor: grabbing;
    }

    .glass-dark {
      background: rgba(18, 25, 28, 0.86);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 244, 214, 0.24);
      color: #f8f5ee;
    }

    .nav-pill.active {
      background: #3730a3;
      color: #ffffff;
      box-shadow: 0 4px 12px rgba(55, 48, 163, 0.25);
    }

    ::-webkit-scrollbar {
      width: 7px;
      height: 7px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(24, 32, 38, 0.18);
      border-radius: 999px;
    }

    .tlh-card-warm { background:linear-gradient(180deg,#f8f2e3,#f2ead6); border:1px solid rgba(217,164,65,.22); border-radius:1rem; }

    .gw-stage-frame { border-radius:1.4rem; box-shadow:0 24px 60px rgba(15,27,45,.28), inset 0 0 0 1px rgba(246,231,193,.22); }
    .glass-dark { background:rgba(12,20,34,.72); border:1px solid rgba(246,231,193,.28); border-radius:.9rem; }
    .nav-pill { border-radius:999px!important; padding:.45rem .95rem!important; transition:all .2s; }
    .nav-pill:not(.active):hover { background:rgba(217,164,65,.16)!important; color:var(--ink); }
    .nav-pill.active { background:linear-gradient(135deg,var(--navy),#2f3f73)!important; box-shadow:0 6px 16px rgba(27,42,74,.32)!important; }

    button { transition:transform .15s, box-shadow .2s, background .2s; }
    button:active { transform:scale(.97); }
    .bg-amber-100 { background:var(--gold-soft)!important; }
    .text-indigo-800, .text-indigo-700, .text-indigo-900 { color:#27386b!important; }

    function hashString(str) {
      let h = 2166136261 >>> 0;
      for (let i = 0; i < str.length; i++) {
        h ^= str.charCodeAt(i);
        h = Math.imul(h, 16777619);
      }
      return h >>> 0;
    }

    function createRng(seed) {
      let a = seed >>> 0;
      return function () {
        a |= 0;
        a = (a + 0x6D2B79F5) | 0;
        let t = Math.imul(a ^ (a >>> 15), 1 | a);
        t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
      };
    }

    function clamp(v, min, max) {
      return v < min ? min : v > max ? max : v;
    }

    function lerp(a, b, t) {
      return a + (b - a) * t;
    }

    function smoothstep(edge0, edge1, x) {
      const t = clamp((x - edge0) / (edge1 - edge0), 0, 1);
      return t * t * (3 - 2 * t);
    }

    function hexToRgb(hex) {
      const clean = hex.replace('#', '');
      const num = parseInt(clean, 16);
      return { r: (num >> 16) & 255, g: (num >> 8) & 255, b: num & 255 };
    }

    function rgbToCss(rgb, alpha = 1) {
      const r = Math.round(clamp(rgb.r, 0, 255));
      const g = Math.round(clamp(rgb.g, 0, 255));
      const b = Math.round(clamp(rgb.b, 0, 255));
      return alpha < 1 ? `rgba(${r},${g},${b},${alpha.toFixed(3)})` : `rgb(${r},${g},${b})`;
    }

    function shadeColor(hex, factor, tintHex = null, tintAmt = 0) {
      const c = hexToRgb(hex);
      let r = c.r * factor;
      let g = c.g * factor;
      let b = c.b * factor;
      if (tintHex && tintAmt > 0) {
        const t = hexToRgb(tintHex);
        r = lerp(r, t.r, tintAmt);
        g = lerp(g, t.g, tintAmt);
        b = lerp(b, t.b, tintAmt);
      }
      return rgbToCss({ r, g, b });
    }

    function mixHex(hexA, hexB, t) {
      const a = hexToRgb(hexA);
      const b = hexToRgb(hexB);
      return rgbToCss({
        r: lerp(a.r, b.r, t),
        g: lerp(a.g, b.g, t),
        b: lerp(a.b, b.b, t)

    function resolveTheme(kind) {
      const canonical = THEME_ALIASES[kind] || (BASE_THEMES[kind] ? kind : 'tree');
      const base = BASE_THEMES[canonical];
      return {
        canonical,
        title: DISPLAY_TITLES[kind] || base.title,
        ...base
      };
    }

    const ISO_COS = 0.8660254;
    const ISO_SIN = 0.485;

    function isoProject(gx, gy, gz, originX, originY, tileW) {
      return {
        x: originX + (gx - gy) * ISO_COS * tileW,
        y: originY + (gx + gy) * ISO_SIN * tileW - gz * tileW * 0.94
      };
    }

    function drawIsoPrism(ctx, cx, cy, cz, w, d, h, topCol, leftCol, rightCol, originX, originY, tileW, strokeCol = null) {
      const hw = w * 0.5;
      const hd = d * 0.5;
      const p000 = isoProject(cx - hw, cy - hd, cz, originX, originY, tileW);
      const p100 = isoProject(cx + hw, cy - hd, cz, originX, originY, tileW);
      const p110 = isoProject(cx + hw, cy + hd, cz, originX, originY, tileW);
      const p010 = isoProject(cx - hw, cy + hd, cz, originX, originY, tileW);

      const p001 = isoProject(cx - hw, cy - hd, cz + h, originX, originY, tileW);
      const p101 = isoProject(cx + hw, cy - hd, cz + h, originX, originY, tileW);
      const p111 = isoProject(cx + hw, cy + hd, cz + h, originX, originY, tileW);
      const p011 = isoProject(cx - hw, cy + hd, cz + h, originX, originY, tileW);

      ctx.fillStyle = leftCol;
      ctx.beginPath();
      ctx.moveTo(p010.x, p010.y);
      ctx.lineTo(p110.x, p110.y);
      ctx.lineTo(p111.x, p111.y);
      ctx.lineTo(p011.x, p011.y);
      ctx.closePath();
      ctx.fill();
      if (strokeCol) { ctx.strokeStyle = strokeCol; ctx.lineWidth = 1; ctx.stroke(); }

      ctx.fillStyle = rightCol;
      ctx.beginPath();
      ctx.moveTo(p110.x, p110.y);
      ctx.lineTo(p100.x, p100.y);
      ctx.lineTo(p101.x, p101.y);
      ctx.lineTo(p111.x, p111.y);
      ctx.closePath();
      ctx.fill();
      if (strokeCol) { ctx.strokeStyle = strokeCol; ctx.lineWidth = 1; ctx.stroke(); }

      ctx.fillStyle = topCol;
      ctx.beginPath();
      ctx.moveTo(p001.x, p001.y);
      ctx.lineTo(p101.x, p101.y);
      ctx.lineTo(p111.x, p111.y);
      ctx.lineTo(p011.x, p011.y);
      ctx.closePath();
      ctx.fill();
      if (strokeCol) { ctx.strokeStyle = strokeCol; ctx.lineWidth = 1; ctx.stroke(); }

      return { p001, p101, p111, p011, p010, p110, p100 };
    }

function buildSceneData(kind, stage, frac) {
      const sReal = clamp(Math.floor(Number(stage) || 0), 0, MAX_STAGE);
      const s = Math.min(sReal, 8); // legacy stage 9-12 generators are replaced by LATE[]
      const f = clamp(Number(frac) || 0, 0, 1);
      const cfg = resolveTheme(kind);
      const c = cfg.canonical;
      const rng = createRng(hashString(`${c}_${kind}_${s}`));

      const buildings = [];
      const trees = [];
      const props = [];
      const creatures = [];

      const clouds = [];
      for (let i = 0; i < 5; i++) {
        clouds.push({
          u: (i * 0.22 + rng() * 0.08) % 1.15 - 0.08,
          v: 0.06 + (i % 3) * 0.042,
          scale: 0.72 + (i % 3) * 0.24,
          speed: 0.004 + (i % 3) * 0.0014,
          opacity: 0.48 + (i % 3) * 0.12
        });
      }

      const birds = [];
      const birdCount = (c === 'space' || c === 'sea' || c === 'aquarium') ? 0 : Math.min(7, 2 + Math.floor(s * 0.45));
      for (let i = 0; i < birdCount; i++) {
        birds.push({
          cx: 0.22 + rng() * 0.56,
          cy: 0.10 + rng() * 0.13,
          rx: 0.05 + rng() * 0.08,
          ry: 0.014 + rng() * 0.02,
          speed: 0.36 + rng() * 0.28,
          phase: rng() * Math.PI * 2,
          size: 3.4 + rng() * 1.6
        });
      }

      const particles = [];
      const particleCount = Math.min(34, 14 + s * 2);
      for (let i = 0; i < particleCount; i++) {
        particles.push({
          gx: (rng() - 0.5) * 6.2,
          gy: (rng() - 0.5) * 6.2,
          gz: 0.2 + rng() * 2.5,
          speed: 0.45 + rng() * 0.85,
          phase: rng() * Math.PI * 2,
          radius: 1.4 + rng() * 1.5
        });
      }

      function addBuilding(spec) {
        if (s < spec.unlockStage) return;
        const isNew = spec.unlockStage === s && s > 0;
        const constructionScale = isNew ? lerp(0.78, 1.0, smoothstep(0.0, 0.45, f)) : 1.0;
        buildings.push({
          ...spec,
          constructionScale,
          depth: spec.gx + spec.gy + (spec.gz || 0) * 0.15
        });
      }

      function addTree(gx, gy, gz, scale, variant, unlockStage = 0) {
        if (s < unlockStage) return;
        const grow = (unlockStage === s && s > 0) ? lerp(0.74, 1.0, smoothstep(0, 0.55, f)) : 1.0;
        trees.push({
          gx, gy, gz,
          scale: scale * grow,
          variant,
          phase: (gx * 1.7 + gy * 2.3) % (Math.PI * 2),
          depth: gx + gy + gz * 0.1
        });
      }

      function addProp(gx, gy, gz, type, scale = 1, unlockStage = 0) {
        if (s < unlockStage) return;
        props.push({ gx, gy, gz, type, scale, depth: gx + gy + gz * 0.1 });
      }

      if (c === 'bamboo') {
        // Stage 0: Untouched Bamboo Grove & Young Panda
        addTree(-2.85, -2.55, 0, 0.86, 'bamboo', 0);
        addTree(2.65, -2.65, 0, 0.88, 'bamboo', 0);
        addProp(1.45, 1.35, 0, 'koi_pond', 0.90, 0);
        addProp(-2.35, 2.55, 0, 'moss_rock', 0.88, 0);
        creatures.push({ type: 'panda_sit', gx0: -1.45, gy0: -1.15, rx: 0, ry: 0, speed: 0, phase: 0, gz: 0 });

        // Stage 1: Stone Lanterns & Butterfly
        addProp(-0.65, 2.75, 0, 'toro_lantern', 0.88, 1);
        addProp(0.65, 2.75, 0, 'toro_lantern', 0.88, 1);
        creatures.push({ type: 'butterfly', gx0: -1.15, gy0: -2.25, rx: 0.45, ry: 0.35, speed: 1.45, phase: 0.4, gz: 0.65 });

        // Stage 2: Bamboo Water Fountain & Bamboo Fence
        addProp(0.55, 0.75, 0, 'shishi_odoshi', 0.92, 2);
        addProp(-2.45, 0.05, 0, 'bamboo_fence', 0.86, 2);

        // Stage 3: Crimson Arch Bridge & Extra Bamboo
        addProp(1.45, 2.15, 0.04, 'red_arch_bridge', 0.88, 3);
        addTree(-2.15, -2.90, 0, 0.94, 'bamboo', 3);

        // Stage 4: Zen Tea Pavilion
        addBuilding({
          id: 'tea_pavilion', name: 'Zen Tea Pavilion', category: 'Sanctuary Architecture',
          unlockStage: 4, gx: -1.95, gy: 0.75, gz: 0, w: 1.08, d: 1.02, h: 0.98,
          arch: 'japanese_pavilion', lore: 'Curved irimoya tiled roof overlooking the koi pond.'
        });
        addProp(-1.15, 1.55, 0, 'wooden_bench', 0.82, 4);

        // Stage 5: Strolling Panda Companion
        if (s >= 5) creatures.push({ type: 'panda_walk', gx0: -0.15, gy0: 2.35, rx: 0.65, ry: 0.22, speed: 0.42, phase: 1.1, gz: 0 });

        // Stage 6: Torii Shrine Gate & Plum Blossom Tree
        addProp(-2.55, 2.55, 0, 'torii_gate', 0.94, 6);
        addTree(-1.25, -2.75, 0, 0.88, 'plum_blossom', 6);
        addProp(-0.75, -1.25, 0, 'flower_patch', 0.84, 6);

        // Stage 7: Bamboo Scroll Kiosk
        addBuilding({
          id: 'bamboo_teahouse_east', name: 'Bamboo Scroll Kiosk', category: 'Study Retreat',
          unlockStage: 7, gx: 2.25, gy: -0.35, gz: 0, w: 0.98, d: 0.94, h: 0.90,
          arch: 'japanese_pavilion', lore: 'Quiet garden shelter stocked with calligraphy scrolls and tea.'
        });

        // Stage 8: 5-Tier Imperial Chinese Pagoda
        addBuilding({
          id: 'bamboo_pagoda', name: '5-Tier Imperial Chinese Pagoda',
          category: 'Hero Landmark', unlockStage: 8, gx: 0.25, gy: -1.75, gz: 0,
          w: 1.24, d: 1.24, h: 2.24,
          arch: 'pagoda_5',

      function addLateStages() {
        if (FULL_LAYOUT[c]) { buildings.length = 0; trees.length = 0; props.length = 0; creatures.length = 0; } // forest uses its own full layout
        if (sReal < 9 && !FULL_LAYOUT[c]) return;
        (LATE[c] || []).forEach((e) => {
          if (sReal < e.u || (e.m && sReal >= e.m)) return;
          const g = e.u === sReal ? lerp(0.78, 1.0, smoothstep(0.0, 0.45, f)) : 1.0;
          if (e.k === 'b') {
            buildings.push({ id: e.id, name: e.n, category: e.cat, unlockStage: e.u, gx: e.x, gy: e.y, gz: 0,
              w: e.w, d: e.d, h: e.h, arch: e.a, lore: e.l, pal: e.pal, constructionScale: g, depth: e.x + e.y });
          } else if (e.k === 't') {
            trees.push({ gx: e.x, gy: e.y, gz: 0, scale: (e.sc || 0.86) * g, variant: e.v,
              phase: (e.x * 1.7 + e.y * 2.3) % (Math.PI * 2), depth: e.x + e.y });
          } else if (e.k === 'p') {
            props.push({ gx: e.x, gy: e.y, gz: e.z || 0, type: e.v, scale: e.sc || 0.86, depth: e.x + e.y, len: e.len, dir: e.dir, style: e.style });
          } else {
            creatures.push({ type: e.v, gx0: e.x, gy0: e.y, rx: e.rx || 0, ry: e.ry || 0, speed: e.sp || 0.4,
              phase: e.ph || 0, gz: e.z || 0, oceanOrbit: e.oo, hasFlower: e.fl, sc: e.sc || 1, kind: e.kind });
          }
        });
      }

      addLateStages();
      return {
        kind, cfg, stage: sReal, frac: f,
        buildings, trees, props, clouds, birds, particles, creatures
      };
    }

    function renderSceneFrame(ctx, w, h, scene, timeSec, hoverId, levelUpState, isThumb, panOffset, zoomScale, lightingMode) {
      const { cfg, stage } = scene;
      const c = cfg.canonical;
      const mode = ((c === 'haunted' || c === 'wizard') && (lightingMode || 'day') === 'day') ? 'night' : (lightingMode || 'day'); // haunted manor is always moonlit
      const isNight = mode === 'night';
      const isSunset = mode === 'sunset';

      ctx.save();

      const skyGrad = ctx.createLinearGradient(0, 0, 0, h * 0.75);
      if (isNight) {
        skyGrad.addColorStop(0, '#050816');
        skyGrad.addColorStop(0.58, '#0f172a');
        skyGrad.addColorStop(1, '#1e293b');
      } else if (isSunset) {
        skyGrad.addColorStop(0, '#4c1d95');
        skyGrad.addColorStop(0.45, '#ea580c');
        skyGrad.addColorStop(1, '#fde047');
      } else {
        skyGrad.addColorStop(0, cfg.skyTop);
        skyGrad.addColorStop(0.62, mixHex(cfg.skyTop, cfg.skyHorizon, 0.64));
        skyGrad.addColorStop(1, cfg.skyHorizon);
      }
      ctx.fillStyle = skyGrad;
      ctx.fillRect(0, 0, w, h);

      if (c === 'space') {
        drawSpaceCosmicSky(ctx, w, h, timeSec, isThumb);
      } else if (c === 'sea') {
        drawDeepSeaBackdrop(ctx, w, h, timeSec, isThumb, isNight);
      } else if (c === 'aquarium') {
        drawAquariumRoomBackdrop(ctx, w, h, isNight);
      } else {
        if (isNight) {
          for (let i = 0; i < 48; i++) {
            const sx = ((i * 173) % 1000) / 1000 * w;
            const sy = ((i * 89) % 1000) / 1000 * (h * 0.45);
            const tw = 0.35 + 0.65 * (0.5 + 0.5 * Math.sin(timeSec * 2.2 + i));
            ctx.fillStyle = `rgba(248, 250, 252, ${tw.toFixed(2)})`;
            ctx.beginPath();
            ctx.arc(sx, sy, i % 4 === 0 ? 1.5 : 0.9, 0, Math.PI * 2);
            ctx.fill();
          }
          const moonX = w * 0.80;
          const moonY = h * 0.14;
          const mGlow = ctx.createRadialGradient(moonX, moonY, 4, moonX, moonY, 55);
          mGlow.addColorStop(0, 'rgba(254, 249, 195, 0.7)');
          mGlow.addColorStop(1, 'rgba(254, 249, 195, 0)');
          ctx.fillStyle = mGlow;
          ctx.beginPath();
          ctx.arc(moonX, moonY, 55, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = '#fef9c3';
          ctx.beginPath();
          ctx.arc(moonX, moonY, 15, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = '#090e21';
          ctx.beginPath();
          ctx.arc(moonX + 6, moonY - 3, 13, 0, Math.PI * 2);
          ctx.fill();
        } else {
          const sunX = (c === 'beach' || isSunset) ? w * 0.24 : w * 0.18;
          const sunY = isSunset ? h * 0.34 : (c === 'beach' ? h * 0.24 : h * 0.15);
          const sunGrad = ctx.createRadialGradient(sunX, sunY, 5, sunX, sunY, Math.max(w, h) * 0.48);
          sunGrad.addColorStop(0, isSunset ? 'rgba(255, 251, 214, 0.95)' : 'rgba(255, 246, 214, 0.65)');
          sunGrad.addColorStop(0.32, isSunset ? 'rgba(251, 146, 60, 0.52)' : 'rgba(255, 224, 150, 0.25)');
          sunGrad.addColorStop(1, 'rgba(255, 224, 150, 0.0)');
          ctx.fillStyle = sunGrad;
          ctx.fillRect(0, 0, w, h);
        }

        if (!isThumb && !isNight) {
          scene.clouds.forEach((cl) => {
            const cx = (((cl.u + timeSec * cl.speed) % 1.25) - 0.12) * w;
            const cy = cl.v * h;
            drawCloud(ctx, cx, cy, cl.scale * (w / 900), isSunset ? cl.opacity * 0.7 : cl.opacity, isSunset ? '#fed7aa' : '#fffdf5');
          });
        }

        if (c !== 'beach') {
          const m1Col = isNight ? '#0f172a' : isSunset ? '#7c2d12' : mixHex(cfg.distantMountain, cfg.hazeColor, 0.35);
          const m2Col = isNight ? '#090d1a' : isSunset ? '#431407' : mixHex(cfg.midMountain, cfg.hazeColor, 0.18);
          drawMountainRange(ctx, w, h, 0.42, 0.115, 5, m1Col, 0.85);
          drawMountainRange(ctx, w, h, 0.475, 0.095, 7, m2Col, 0.94);
        }
        if (c === 'catisland') drawFuji(ctx, w, h, isNight, isSunset);

        const horizonY = h * 0.49;
        const seaGrad = ctx.createLinearGradient(0, horizonY, 0, h);
        if (isNight) {
          seaGrad.addColorStop(0, '#0f172a');
          seaGrad.addColorStop(0.4, '#082f49');
          seaGrad.addColorStop(1, '#020617');
        } else if (isSunset) {
          seaGrad.addColorStop(0, '#fdba74');
          seaGrad.addColorStop(0.32, '#0284c7');
          seaGrad.addColorStop(1, '#0c4a6e');
        } else if ((c === 'island' || c === 'catisland')) {
          seaGrad.addColorStop(0, '#7dd3fc');
          seaGrad.addColorStop(0.22, '#0ea5e9');
          seaGrad.addColorStop(0.58, '#0284c7');
          seaGrad.addColorStop(1, '#0c4a6e');
        } else {
          seaGrad.addColorStop(0, mixHex(cfg.waterShallow, cfg.hazeColor, 0.32));
          seaGrad.addColorStop(0.32, cfg.waterShallow);
          seaGrad.addColorStop(1, cfg.waterDeep);
        }
        ctx.fillStyle = seaGrad;
        ctx.fillRect(0, horizonY, w, h - horizonY);

        if (!isThumb && (c === 'island' || c === 'catisland') && !isNight) {
          // Realistic rolling ocean swells & sunlit wave crests for Tropical Paradise Island
          for (let row = 0; row < 16; row++) {
            const tRow = row / 15;
            const wy = horizonY + 8 + tRow * (h - horizonY - 12);
            const swellAmp = lerp(1.5, 5.2, tRow);
            const wavePhase = timeSec * (1.25 + (row % 3) * 0.25) + row * 1.4;
            ctx.strokeStyle = row % 2 === 0
              ? `rgba(224, 242, 254, ${(0.16 + tRow * 0.22).toFixed(2)})`
              : `rgba(12, 74, 110, ${(0.14 + tRow * 0.16).toFixed(2)})`;
            ctx.lineWidth = lerp(1.0, 2.4, tRow);
            ctx.beginPath();
            for (let wx = 0; wx <= w; wx += 28) {
              const offset = Math.sin(wx * 0.018 + wavePhase) * swellAmp;
              if (wx === 0) ctx.moveTo(wx, wy + offset);
              else ctx.lineTo(wx, wy + offset);
            }
            ctx.stroke();
          }
        } else if (!isThumb) {
          ctx.strokeStyle = isNight ? 'rgba(186, 230, 253, 0.14)' : 'rgba(255, 252, 236, 0.24)';
          ctx.lineWidth = 1.25;
          for (let r = 0; r < 12; r++) {
            const ry = horizonY + 12 + r * ((h - horizonY) / 12);
            const waveShift = Math.sin(timeSec * 1.1 + r * 1.35) * 18;
            const rx = ((r * 137) % (w * 0.8)) + w * 0.1 + waveShift;
            const rw = 22 + (r % 4) * 12;
            ctx.beginPath();
            ctx.moveTo(rx - rw, ry);
            ctx.lineTo(rx + rw, ry);
            ctx.stroke();
          }
        }
      }

      const zoom = isThumb ? 1 : clamp(Number(zoomScale) || 1, 0.45, 2.2);
      // ปรับขนาดฐานให้สัมพันธ์กับจำนวนสิ่งของที่เพิ่มขึ้น
      // base spans ~12.5 tiles wide and ~8.8 tiles tall (incl. headroom): fit both so all 4 corners show
      const baseTileW = isThumb
        ? Math.min(w * 0.070, h * 0.098)
        : Math.min(w * 0.072, h * 0.104);
      const tileW = baseTileW * zoom;
      const originX = w * 0.5 + (panOffset ? panOffset.x : 0);
      const originY = h * 0.5 + tileW * 0.2 + (panOffset ? panOffset.y : 0);

      if (c === 'aquarium') {
        drawAquariumTankBase(ctx, originX, originY, tileW, timeSec, false);
      } else {
        drawIsometricPlatformBase(ctx, originX, originY, tileW, cfg, stage, timeSec);
      }

      const renderables = [];
      scene.props.forEach((p) => renderables.push({ kind: 'prop', depth: p.depth, data: p }));
      scene.trees.forEach((t) => renderables.push({ kind: 'tree', depth: t.depth, data: t }));
      scene.buildings.forEach((b) => renderables.push({ kind: 'building', depth: b.depth, data: b }));
      scene.creatures.forEach((cr) => {
        const angle = timeSec * cr.speed + cr.phase;
        let gx = cr.gx0 + Math.cos(angle) * cr.rx;
        let gy = cr.gy0 + Math.sin(angle) * cr.ry;
        let gz = cr.gz || 0;
        let vx = -Math.sin(angle) * cr.rx * cr.speed;
        let vy = Math.cos(angle) * cr.ry * cr.speed;

        if (cr.freeSwim) {
          const w1 = timeSec * cr.speed + cr.phase;
          const w2 = timeSec * (cr.speed * 0.63) + cr.phase * 1.7;
          gx = clamp(cr.gx0 + Math.cos(w1) * cr.rx * 0.72 + Math.sin(w2) * cr.rx * 0.35, -2.55, 2.55);
          gy = clamp(cr.gy0 + Math.sin(w1) * cr.ry * 0.72 + Math.cos(w2 * 1.3) * cr.ry * 0.35, -2.55, 2.55);
          gz = clamp((cr.gz || 1.2) + Math.sin(timeSec * 1.15 + cr.phase * 2.1) * 0.42, 0.35, 2.35);
          vx = -Math.sin(w1) * cr.rx * 0.72 * cr.speed + Math.cos(w2) * cr.rx * 0.35 * cr.speed * 0.63;
          vy = Math.cos(w1) * cr.ry * 0.72 * cr.speed - Math.sin(w2 * 1.3) * cr.ry * 0.35 * cr.speed * 0.82;
        } else if (cr.oceanOrbit) {
          const rNorm = Math.max(Math.abs(gx) / 4.2, Math.abs(gy) / 4.2);
          if (rNorm < 1.06) {
            const push = 1.06 / Math.max(0.1, rNorm);
            gx *= push;
            gy *= push;
          }
        }

        renderables.push({
          kind: 'creature',
          depth: gx + gy + gz * 0.08,
          data: { ...cr, gx, gy, gz, angle, vx, vy }
        });
      });

      renderables.sort((a, b) => a.depth - b.depth);

      const hitBoxes = [];
      const lvlActive = Boolean(levelUpState && (performance.now() - levelUpState.startedAt) < 1900);
      const lvlT = lvlActive ? clamp((performance.now() - levelUpState.startedAt) / 1900, 0, 1) : 0;

      renderables.forEach((item) => {
        if (item.kind === 'prop') {
          drawCustomProp(ctx, item.data, originX, originY, tileW, cfg, timeSec, isNight);
        } else if (item.kind === 'tree') {
          drawCustomFlora(ctx, item.data, originX, originY, tileW, cfg, timeSec);
        } else if (item.kind === 'creature') {
          drawCustomCreature(ctx, item.data, originX, originY, tileW, cfg, timeSec);
        } else if (item.kind === 'building') {
          const isHovered = hoverId === item.data.id;
          const pulse = lvlActive ? Math.sin(lvlT * Math.PI) * 0.85 : 0;
          const hb = drawCustomLandmark(ctx, item.data, originX, originY, tileW, cfg, timeSec, isHovered, pulse, isNight);
          if (hb) hitBoxes.push(hb);
        }
      });

      if (c === 'aquarium') {
        drawAquariumTankBase(ctx, originX, originY, tileW, timeSec, true);
      }

      if (!isThumb) {
        scene.particles.forEach((pt) => {
          const ang = timeSec * pt.speed + pt.phase;
          const px = pt.gx + Math.cos(ang) * 0.35;
          const py = pt.gy + Math.sin(ang) * 0.35;
          const pz = pt.gz + ((timeSec * pt.speed * 0.5 + pt.phase) % 1.4);
          const sp = isoProject(px, py, pz, originX, originY, tileW);
          ctx.fillStyle = (c === 'aquarium' || c === 'sea')
            ? 'rgba(224, 242, 254, 0.55)'
            : isNight
              ? 'rgba(254, 240, 138, 0.65)'
              : 'rgba(255, 252, 232, 0.45)';
          ctx.beginPath();
          ctx.arc(sp.x, sp.y, pt.radius, 0, Math.PI * 2);
          ctx.fill();
        });

        scene.birds.forEach((bd) => {
          const ang = timeSec * bd.speed + bd.phase;
          const bx = (bd.cx + Math.cos(ang) * bd.rx) * w;
          const by = (bd.cy + Math.sin(ang) * bd.ry) * h;
          const wing = Math.sin(timeSec * 8.5 + bd.phase) * bd.size * 0.65;
          ctx.strokeStyle = isNight ? 'rgba(226, 232, 240, 0.55)' : 'rgba(28, 38, 46, 0.65)';
          ctx.lineWidth = 1.4;
          ctx.beginPath();
          ctx.moveTo(bx - bd.size, by + wing);
          ctx.quadraticCurveTo(bx - bd.size * 0.4, by - bd.size * 0.45, bx, by);
          ctx.quadraticCurveTo(bx + bd.size * 0.4, by - bd.size * 0.45, bx + bd.size, by + wing);
          ctx.stroke();
        });
      }

      if (!isThumb && (c === 'sea' || c === 'aquarium')) drawReefFx(ctx, w, h, timeSec, c === 'aquarium');
      if (!isThumb && c === 'christmas') drawFalling(ctx, w, h, timeSec, 70, '255,255,255', false);
      if (!isThumb && c === 'catisland') drawFalling(ctx, w, h, timeSec, 26, '255,182,206', true);

      if (!isThumb && lvlActive) {
        const ringAlpha = (1 - lvlT) * 0.88;
        const maxR = Math.max(w, h) * 0.46;
        for (let rIdx = 0; rIdx < 2; rIdx++) {
          const progress = clamp((lvlT - rIdx * 0.14) / 0.86, 0, 1);
          if (progress > 0) {
            ctx.strokeStyle = rIdx === 0
              ? `rgba(253, 224, 71, ${ringAlpha.toFixed(2)})`
              : `rgba(56, 189, 248, ${(ringAlpha * 0.75).toFixed(2)})`;
            ctx.lineWidth = (1 - progress) * 7 + 1.5;
            ctx.beginPath();
            ctx.ellipse(originX, originY - tileW * 0.4, progress * maxR, progress * maxR * 0.56, 0, 0, Math.PI * 2);
            ctx.stroke();
          }
        }

        const burstCols = ['#fde047', '#38bdf8', '#f472b6', '#4ade80', '#fb923c', '#ffffff'];
        for (let p = 0; p < 30; p++) {
          const ang = (p / 30) * Math.PI * 2 + p * 0.21;
          const dist = lvlT * (120 + (p % 5) * 44);
          const px = originX + Math.cos(ang) * dist;
          const py = (originY - tileW * 0.8) + Math.sin(ang) * dist * 0.62 - Math.sin(lvlT * Math.PI) * 52;
          ctx.fillStyle = burstCols[p % burstCols.length];
          ctx.globalAlpha = 1 - lvlT;
          ctx.beginPath();
          ctx.arc(px, py, 3.2 - lvlT * 1.5, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.globalAlpha = 1;

        const bannerAlpha = lvlT < 0.15 ? (lvlT / 0.15) : lvlT > 0.75 ? ((1 - lvlT) / 0.25) : 1;
        const bannerY = h * 0.22 - lvlT * 24;
        ctx.save();
        ctx.globalAlpha = clamp(bannerAlpha, 0, 1);
        ctx.fillStyle = 'rgba(15, 23, 42, 0.84)';
        ctx.strokeStyle = '#fde047';
        ctx.lineWidth = 2;
        const bw = 260;
        const bh = 42;
        ctx.beginPath();
        ctx.roundRect(w * 0.5 - bw * 0.5, bannerY - bh * 0.5, bw, bh, 12);
        ctx.fill();
        ctx.stroke();

        ctx.fillStyle = '#fde047';
        ctx.font = '700 13px Cinzel, Georgia, serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(levelUpState.label || `STAGE ${stage} UNLOCKED!`, w * 0.5, bannerY);
        ctx.restore();
      }

      if (isNight) {
        ctx.fillStyle = 'rgba(8, 15, 38, 0.26)';
        ctx.fillRect(0, 0, w, h);
      } else if (isSunset) {
        ctx.fillStyle = 'rgba(249, 115, 22, 0.10)';
        ctx.fillRect(0, 0, w, h);
      }

      const vig = ctx.createRadialGradient(w * 0.5, h * 0.5, Math.min(w, h) * 0.34, w * 0.5, h * 0.5, Math.max(w, h) * 0.74);
      vig.addColorStop(0, 'rgba(0,0,0,0)');
      vig.addColorStop(1, isNight ? 'rgba(2, 6, 23, 0.42)' : 'rgba(10, 16, 20, 0.24)');
      ctx.fillStyle = vig;
      ctx.fillRect(0, 0, w, h);

      ctx.restore();
      return hitBoxes;
    }

    function drawDeepSeaBackdrop(ctx, w, h, timeSec, isThumb, isNight) {
      const surfGrad = ctx.createLinearGradient(0, 0, 0, h * 0.24);
      surfGrad.addColorStop(0, isNight ? 'rgba(56, 189, 248, 0.35)' : 'rgba(186, 230, 253, 0.78)');
      surfGrad.addColorStop(0.5, 'rgba(56, 189, 248, 0.28)');
      surfGrad.addColorStop(1, 'rgba(14, 116, 144, 0)');
      ctx.fillStyle = surfGrad;
      ctx.fillRect(0, 0, w, h * 0.24);

      for (let i = 0; i < 6; i++) {
        const bx = w * (0.12 + i * 0.15) + Math.sin(timeSec * 0.7 + i) * 16;
        const rayGrad = ctx.createLinearGradient(bx, 0, bx + 45, h * 0.78);
        rayGrad.addColorStop(0, isNight ? 'rgba(125, 211, 252, 0.12)' : 'rgba(186, 230, 253, 0.22)');
        rayGrad.addColorStop(1, 'rgba(186, 230, 253, 0)');
        ctx.fillStyle = rayGrad;
        ctx.beginPath();
        ctx.moveTo(bx - 18, 0);
        ctx.lineTo(bx + 18, 0);
        ctx.lineTo(bx + 78, h * 0.78);
        ctx.lineTo(bx + 12, h * 0.78);
        ctx.closePath();
        ctx.fill();
      }

      drawMountainRange(ctx, w, h, 0.45, 0.11, 6, 'rgba(8, 51, 78, 0.72)', 0.85);
      drawMountainRange(ctx, w, h, 0.51, 0.08, 8, 'rgba(6, 38, 60, 0.88)', 0.95);
    }

    function drawSpaceCosmicSky(ctx, w, h, timeSec, isThumb) {
      const neb1 = ctx.createRadialGradient(w * 0.72, h * 0.22, 10, w * 0.72, h * 0.22, w * 0.38);
      neb1.addColorStop(0, 'rgba(139, 92, 246, 0.38)');
      neb1.addColorStop(0.5, 'rgba(56, 189, 248, 0.16)');
      neb1.addColorStop(1, 'rgba(15, 23, 42, 0)');
      ctx.fillStyle = neb1;
      ctx.fillRect(0, 0, w, h);

      for (let i = 0; i < 55; i++) {
        const sx = ((i * 193) % 1000) / 1000 * w;
        const sy = ((i * 97) % 1000) / 1000 * (h * 0.68);
        const twinkle = 0.35 + 0.65 * (0.5 + 0.5 * Math.sin(timeSec * 2.5 + i));
        ctx.fillStyle = `rgba(248, 250, 252, ${twinkle.toFixed(2)})`;
        ctx.beginPath();
        ctx.arc(sx, sy, (i % 3 === 0 ? 1.5 : 0.9), 0, Math.PI * 2);
        ctx.fill();
      }

      const sunX = w * 0.13;
      const sunY = h * 0.16;
      const sunR = Math.min(w, h) * 0.088;
      const corona = ctx.createRadialGradient(sunX, sunY, sunR * 0.3, sunX, sunY, sunR * 3.3);
      corona.addColorStop(0, 'rgba(255, 251, 214, 0.96)');
      corona.addColorStop(0.35, 'rgba(251, 191, 36, 0.45)');
      corona.addColorStop(1, 'rgba(251, 146, 60, 0)');
      ctx.fillStyle = corona;
      ctx.beginPath();
      ctx.arc(sunX, sunY, sunR * 3.3, 0, Math.PI * 2);
      ctx.fill();

      const satX = w * 0.81;
      const satY = h * 0.19;
      const satR = Math.min(w, h) * 0.062;
      ctx.save();
      ctx.translate(satX, satY);
      ctx.rotate(-0.34);
      ctx.strokeStyle = 'rgba(253, 230, 138, 0.58)';
      ctx.lineWidth = satR * 0.25;
      ctx.beginPath();
      ctx.ellipse(0, 0, satR * 2.4, satR * 0.6, 0, 0, Math.PI * 2);
      ctx.stroke();
      ctx.strokeStyle = 'rgba(245, 158, 11, 0.48)';
      ctx.lineWidth = satR * 0.1;
      ctx.beginPath();
      ctx.ellipse(0, 0, satR * 1.95, satR * 0.46, 0, 0, Math.PI * 2);
      ctx.stroke();
      const satGrad = ctx.createRadialGradient(-satR * 0.3, -satR * 0.3, 2, 0, 0, satR);
      satGrad.addColorStop(0, '#fef3c7');
      satGrad.addColorStop(0.6, '#f59e0b');
      satGrad.addColorStop(1, '#78350f');
      ctx.fillStyle = satGrad;
      ctx.beginPath();
      ctx.arc(0, 0, satR, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();

      const moonX = w * 0.36;
      const moonY = h * 0.12;
      ctx.fillStyle = '#e0f2fe';
      ctx.beginPath();
      ctx.arc(moonX, moonY, 13, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#121b38';
      ctx.beginPath();
      ctx.arc(moonX + 5.5, moonY - 3, 11, 0, Math.PI * 2);
      ctx.fill();

      if (!isThumb) {
        const cometProgress = (timeSec * 0.14) % 1;
        const cx = lerp(w * 0.66, w * 0.22, cometProgress);
        const cy = lerp(h * 0.06, h * 0.28, cometProgress);
        const tail = ctx.createLinearGradient(cx, cy, cx + 68, cy - 34);
        tail.addColorStop(0, 'rgba(186, 230, 253, 0.92)');
        tail.addColorStop(1, 'rgba(186, 230, 253, 0)');
        ctx.strokeStyle = tail;
        ctx.lineWidth = 2.8;
        ctx.beginPath();
        ctx.moveTo(cx, cy);
        ctx.lineTo(cx + 68, cy - 34);
        ctx.stroke();
      }
    }

    function drawAquariumRoomBackdrop(ctx, w, h, isNight) {
      const bg = ctx.createRadialGradient(w * 0.5, h * 0.42, 20, w * 0.5, h * 0.5, Math.max(w, h) * 0.72);
      bg.addColorStop(0, isNight ? '#0e3a4d' : '#164e63');
      bg.addColorStop(0.6, isNight ? '#081b29' : '#0f293a');
      bg.addColorStop(1, '#050e17');
      ctx.fillStyle = bg;
      ctx.fillRect(0, 0, w, h);
    }

    const FUN_COLS = ['#ef4444', '#f59e0b', '#22c55e', '#38bdf8', '#a855f7', '#ec4899'];
    function stripedCone(ctx, cx, cyBase, rx, ry, apexY, n, colA, colB, rot) {
      for (let i = 0; i < n; i++) {
        const a0 = rot + i * 2 * Math.PI / n, a1 = rot + (i + 1) * 2 * Math.PI / n, am = (a0 + a1) / 2;
        if (Math.sin(am) < -0.05) continue;
        ctx.fillStyle = i % 2 ? colB : colA;
        ctx.beginPath(); ctx.moveTo(cx, apexY);
        ctx.lineTo(cx + Math.cos(a0) * rx, cyBase + Math.sin(a0) * ry);
        ctx.lineTo(cx + Math.cos(a1) * rx, cyBase + Math.sin(a1) * ry);
        ctx.closePath(); ctx.fill();
      }
    }

    function drawFuji(ctx, w, h, isNight, isSunset) {
      const cx = w * 0.70, bw = w * 0.66, baseY = h * 0.49 + 2, peakY = h * 0.115, topW = bw * 0.065, rise = baseY - peakY;
      const edge = (u) => topW + (bw / 2 - topW) * Math.pow(u, 1.28);
      const g = ctx.createLinearGradient(0, peakY, 0, baseY);
      if (isNight) { g.addColorStop(0, '#2b3a66'); g.addColorStop(1, '#161d3a'); }
      else if (isSunset) { g.addColorStop(0, '#d97757'); g.addColorStop(1, '#7c3a5a'); }
      else { g.addColorStop(0, '#7f97c8'); g.addColorStop(1, '#4d68a2'); }
      ctx.fillStyle = g; ctx.beginPath(); ctx.moveTo(cx - bw / 2, baseY);
      for (let k = 0; k <= 24; k++) { const u = k / 24; ctx.lineTo(cx - edge(1 - u), peakY + rise * (1 - u)); }
      for (let k = 0; k <= 24; k++) { const u = k / 24; ctx.lineTo(cx + edge(u), peakY + rise * u); }
      ctx.closePath(); ctx.fill();
      ctx.fillStyle = isNight ? 'rgba(10,14,30,0.30)' : 'rgba(30,45,90,0.20)';
      ctx.beginPath(); ctx.moveTo(cx, peakY); for (let k = 0; k <= 24; k++) { const u = k / 24; ctx.lineTo(cx + edge(u), peakY + rise * u); } ctx.lineTo(cx + 2, baseY); ctx.closePath(); ctx.fill();
      const capU = 0.36, jag = 9;
      ctx.fillStyle = isNight ? '#c7d2ea' : isSunset ? '#ffe8d8' : '#f8fafc';
      ctx.beginPath(); ctx.moveTo(cx - topW, peakY);
      for (let k = 0; k <= 10; k++) { const u = k / 10 * capU; ctx.lineTo(cx - edge(u) , peakY + rise * u); }
      for (let k = 0; k <= jag; k++) { const t = k / jag, x = cx - edge(capU) + t * 2 * edge(capU); ctx.lineTo(x, peakY + rise * capU + (k % 2 ? 0.07 : -0.01) * rise * (1 + 0.5 * Math.sin(k * 2.1))); }
      for (let k = 10; k >= 0; k--) { const u = k / 10 * capU; ctx.lineTo(cx + edge(u), peakY + rise * u); }
      ctx.closePath(); ctx.fill();
      const hz = ctx.createLinearGradient(0, baseY - rise * 0.25, 0, baseY);

      let dragMoved = false;
      let dragStart = { x: 0, y: 0 };
      let panStart = { x: 0, y: 0 };

        if (!state.interactive) return;

        if (!state.interactive) return;

        const py = e.clientY - rect.top;

          const dy = py - dragStart.y;

          panOffset.x = clamp(panStart.x + dx, -width * 0.42, width * 0.42);
          panOffset.y = clamp(panStart.y + dy, -height * 0.42, height * 0.42);
          return;
        }

        const hit = findHit(px, py);
        const nextId = hit ? hit.id : null;
        if (nextId !== hoverId) {
          hoverId = nextId;
          canvas.classList.toggle('is-hovering', Boolean(hoverId));
        }
      }

      function onPointerUp(e) {
        if (!state.interactive) return;
        const wasClick = isDragging && !dragMoved;
        isDragging = false;
        if (wasClick) {
          const rect = canvas.getBoundingClientRect();
          const hit = findHit(e.clientX - rect.left, e.clientY - rect.top);
          if (hit && state.onSelectBuilding) state.onSelectBuilding(hit);
        }
      }

      function onPointerLeave() {
        isDragging = false;
        hoverId = null;
        canvas.classList.remove('is-hovering');
      }

      function onWheel(e) {
        if (!state.interactive) return;
        e.preventDefault();
        const delta = e.deltaY < 0 ? 0.1 : -0.1;
        zoomScale = clamp(zoomScale + delta, 0.45, 2.2);

        canvas.addEventListener('pointerdown', onPointerDown);
        canvas.addEventListener('pointermove', onPointerMove);
        canvas.addEventListener('pointerup', onPointerUp);
        canvas.addEventListener('pointerleave', onPointerLeave);
        canvas.addEventListener('wheel', onWheel, { passive: false });
      }

      function frame(now) {
        if (destroyed) return;
        if (isThumbnailMode()) {
          renderStaticThumbnail();
          return;
        }
        hitBoxes = renderSceneFrame(
          ctx, width, height, scene, now * 0.001,
          hoverId, levelUpState, false, panOffset, zoomScale, state.lighting
        ) || [];
        rafId = requestAnimationFrame(frame);
      }

      if (isThumbnailMode()) {
        renderStaticThumbnail();
      } else {
        rafId = requestAnimationFrame(frame);
      }

      return {
        update(nextOpts = {}) {
          let rebuild = false;
          if (nextOpts.kind && nextOpts.kind !== state.kind) {
            state.kind = nextOpts.kind;

          }

            const ns = clamp(Math.floor(nextOpts.stage), 0, MAX_STAGE);
            if (ns !== state.stage) {
              state.stage = ns;
              rebuild = true;
            }
          }
          if (typeof nextOpts.frac === 'number') {
            const nf = clamp(nextOpts.frac, 0, 1);
            if (Math.abs(nf - state.frac) > 0.002) {

              rebuild = true;
            }
          }
          if (nextOpts.lighting) {
            state.lighting = nextOpts.lighting;
          }

        },
        adjustZoom(delta) {
          zoomScale = clamp(zoomScale + delta, 0.45, 2.2);

        },
        resetView() {
          panOffset = { x: 0, y: 0 };
          zoomScale = 1.0;
        },
        triggerLevelUp(label = '') {

          destroyed = true;
          if (rafId) cancelAnimationFrame(rafId);

          canvas.removeEventListener('pointermove', onPointerMove);
          canvas.removeEventListener('pointerup', onPointerUp);
          canvas.removeEventListener('pointerleave', onPointerLeave);

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return defaultState();
        const parsed = JSON.parse(raw);
        const def = defaultState();
        return {
          ...def,
          ...parsed,
          profile: { ...def.profile, ...(parsed.profile || {}), skills: { ...def.profile.skills, ...((parsed.profile && parsed.profile.skills) || {}) } },
          world: { ...def.world, ...(parsed.world || {}) },
          timer: { ...def.timer, ...(parsed.timer || {}), running: false }
        };
      } catch (e) {
        return defaultState();
      }
    }

    function computeStageFromXp(xp) {
      const safeXp = Math.max(0, Number(xp) || 0);
      const rawLevel = safeXp / 100;
      const stage = Math.min(12, Math.floor(rawLevel));
      const frac = stage >= 12 ? 1 : (rawLevel - stage);
      return { stage, frac, nextStageXp: (stage + 1) * 100 };
    }

    function showToast(title, subtitle = '', tone = 'indigo') {
      const container = document.getElementById('tlh-toast-container');
      if (!container) return;
      const el = document.createElement('div');
      const borderCol = tone === 'amber' ? 'border-amber-400 bg-amber-950/95 text-amber-50' : 'border-indigo-400 bg-slate-900/95 text-white';
      el.className = `pointer-events-auto px-4 py-3 rounded-xl border shadow-xl transition-all duration-300 ${borderCol}`;
      el.innerHTML = `
        <div class="text-xs font-bold tracking-wide">${escapeHtml(title)}</div>
        ${subtitle ? `<div class="text-[11px] opacity-85 mt-0.5">${escapeHtml(subtitle)}</div>` : ''}
      `;
      container.appendChild(el);
      setTimeout(() => {
        el.style.opacity = '0';
        el.style.transform = 'translateY(8px)';
        setTimeout(() => el.remove(), 300);
      }, 3200);
    }

    function escapeHtml(str) {
      return String(str == null ? '' : str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function awardXp(amount, reason = 'Study Milestone', skill = null) {
      const prev = computeStageFromXp(state.world.xp);
      state.world.xp = Math.max(0, (state.world.xp || 0) + amount);
      const next = computeStageFromXp(state.world.xp);

      if (skill && state.profile.skills[skill] != null) {
        state.profile.skills[skill] = Math.min(5, Number((state.profile.skills[skill] + 0.1).toFixed(1)));
      }

      saveState();
      updateHeaderStatus();

      if (activeWorldController) {
        activeWorldController.update({ stage: next.stage, frac: next.frac });
        if (next.stage > prev.stage) {
          activeWorldController.triggerLevelUp(`STAGE ${next.stage}: ${window.GrowthWorld2D.STAGE_NAMES[next.stage].toUpperCase()}`);
        }
      }

      if (next.stage > prev.stage) {
        showToast(`Stage ${next.stage} Unlocked! (+${amount} XP)`, `${window.GrowthWorld2D.STAGE_NAMES[next.stage]} — ${reason}`, 'amber');
      } else {
        showToast(`+${amount} Growth XP Earned`, reason, 'indigo');
      }
    }

      const samePage = state.activePage === pageId;

      cleanupWorldInstances();

    /* --------------------------------------------------------------------- */

    /* --------------------------------------------------------------------- */
    function openOnboardingModal() {
      const modal = document.getElementById('onboarding-modal');
      const form = document.getElementById('onboarding-form');
      if (!modal || !form) return;
      const p = state.profile;
      form.name.value = p.name || '';
      form.objectiveType.value = p.objectiveType || 'toeic';
      form.targetToeic.value = p.targetToeic || 850;
      form.estimatedToeic.value = p.estimatedToeic || '';
      form.level.value = p.level || 'Intermediate';
      form.targetDate.value = p.targetDate || '';
      form.dailyMinutes.value = p.dailyMinutes || 45;
      form.preferredSlot.value = p.preferredSlot || 'Flexible';
      form.skillReading.value = Math.round(p.skills.Reading || 3);
      form.skillListening.value = Math.round(p.skills.Listening || 3);
      form.skillGrammar.value = Math.round(p.skills.Grammar || 3);
      form.skillVocab.value = Math.round(p.skills.Vocabulary || 3);
      form.weaknesses.value = p.weaknesses || '';
      form.methods.value = p.methods || '';
      modal.classList.remove('hidden');
    }

    function closeOnboardingModal() {
      const modal = document.getElementById('onboarding-modal');
      if (modal) modal.classList.add('hidden');
    }

    document.getElementById('onboarding-form').addEventListener('submit', function (e) {
      e.preventDefault();
      const fd = new FormData(e.target);
      state.profile = {
        name: String(fd.get('name') || 'Learner').trim(),
        objectiveType: String(fd.get('objectiveType') || 'toeic'),
        targetToeic: Number(fd.get('targetToeic')) || 850,
        estimatedToeic: fd.get('estimatedToeic') ? Number(fd.get('estimatedToeic')) : state.profile.estimatedToeic,
        level: String(fd.get('level') || 'Intermediate'),
        targetDate: String(fd.get('targetDate') || state.profile.targetDate),
        dailyMinutes: Math.max(10, Number(fd.get('dailyMinutes')) || 45),
        preferredSlot: String(fd.get('preferredSlot') || 'Flexible'),
        weaknesses: String(fd.get('weaknesses') || 'Part 5 Clauses, Part 7 Inference'),
        methods: String(fd.get('methods') || 'Timed Drills, SRS'),
        skills: {
          Reading: Math.min(5, Math.max(1, Number(fd.get('skillReading')) || 3)),
          Listening: Math.min(5, Math.max(1, Number(fd.get('skillListening')) || 3)),
          Grammar: Math.min(5, Math.max(1, Number(fd.get('skillGrammar')) || 3)),
          Vocabulary: Math.min(5, Math.max(1, Number(fd.get('skillVocab')) || 3))
        }
      };
      regenerateTasks(true);
      closeOnboardingModal();
      showToast('Profile Saved', 'Your adaptive curriculum has been updated.');
      navigate(state.activePage);
    });

    function regenerateTasks(silent = false) {
      const mins = state.profile.dailyMinutes || 45;
      const q1 = Math.max(10, Math.round(mins * 0.35));
      const q2 = Math.max(10, Math.round(mins * 0.25));
      const q3 = Math.max(10, mins - q1 - q2);
      state.tasks = [
        { id: 't_' + Date.now() + '_1', title: `Targeted Drill: ${state.profile.weaknesses.split(',')[0] || 'Part 5 Grammar'}`, skill: 'Grammar', duration: q1, xp: q1 * 3, completed: false },
        { id: 't_' + Date.now() + '_2', title: `SRS Vocabulary Review (${state.profile.level})`, skill: 'Vocabulary', duration: q2, xp: q2 * 3, completed: false },
        { id: 't_' + Date.now() + '_3', title: `Timed Reading & Listening Block (${state.profile.targetToeic} Track)`, skill: 'Reading', duration: q3, xp: q3 * 3, completed: false }
      ];
      saveState();
      if (!silent) {
        showToast('Study Queue Regenerated', `Balanced for ${mins} minutes/day.`);
        navigate(state.activePage);
      }
    }

    function toggleTask(taskId) {
      const task = state.tasks.find((t) => t.id === taskId);
      if (!task) return;
      task.completed = !task.completed;
      if (task.completed) {
        awardXp(task.xp, `Completed: ${task.title}`, task.skill);
      } else {
        saveState();
      }
      navigate(state.activePage);
    }

    function addCustomTask(e) {
      e.preventDefault();
      const fd = new FormData(e.target);
      const title = String(fd.get('taskTitle') || '').trim();
      const skill = String(fd.get('taskSkill') || 'Reading');
      if (!title) return;
      state.tasks.push({
        id: 't_' + Date.now(),
        title,
        skill,
        duration: 15,
        xp: 45,
        completed: false
      });
      saveState();
      navigate('study_plan');
    }

    function selectWorldKind(kind) {
      state.world.kind = kind;
      saveState();
      navigate('world');
    }

      state.world.xp = s * 100 + 25;
      saveState();
      const readout = document.getElementById('world-stage-readout');
      if (readout) readout.textContent = String(s);
      if (activeWorldController) {
        activeWorldController.update({ stage: s, frac: 0.25 });
        const hud = document.getElementById('world-hud-stage');
        if (hud) hud.textContent = `Stage ${s} of 12 · ${window.GrowthWorld2D.STAGE_NAMES[s]}`;
      }
      updateHeaderStatus();
    }

    function cycleLighting() {
      const order = ['day', 'sunset', 'night'];
      const cur = state.world.lighting || 'day';
      const next = order[(order.indexOf(cur) + 1) % order.length];
      state.world.lighting = next;
      saveState();
      if (activeWorldController) {
        activeWorldController.update({ lighting: next });
      }
      navigate(state.activePage);
    }

    function adjustWorldZoom(delta) {
      if (activeWorldController) activeWorldController.adjustZoom(delta);
    }

    function resetWorldCamera() {
      if (activeWorldController) activeWorldController.resetView();
    }

    function setTimerPreset(mins) {
      if (timerInterval) clearInterval(timerInterval);
      state.timer.running = false;
      state.timer.presetMinutes = mins;
      state.timer.secondsLeft = mins * 60;
      saveState();
      updateHeaderStatus();
      navigate('timer');
    }

    function setTimerSkill(skill) {
      state.timer.focusSkill = skill;
      saveState();
    }

    function toggleTimer() {
      if (state.timer.running) {
        state.timer.running = false;
        if (timerInterval) clearInterval(timerInterval);
        saveState();
        updateHeaderStatus();
        navigate('timer');
        return;
      }
      state.timer.running = true;
      timerInterval = setInterval(() => {
        if (state.timer.secondsLeft > 0) {
          state.timer.secondsLeft -= 1;
          updateHeaderStatus();
          const disp = document.getElementById('timer-clock-display');
          if (disp) {
            const m = Math.floor(state.timer.secondsLeft / 60);
            const s = String(state.timer.secondsLeft % 60).padStart(2, '0');
            disp.textContent = `${m}:${s}`;
          }
        } else {
          completeTimerNow();
        }
      }, 1000);
      updateHeaderStatus();
      navigate('timer');
    }

    function resetTimer() {
      if (timerInterval) clearInterval(timerInterval);
      state.timer.running = false;
      state.timer.secondsLeft = state.timer.presetMinutes * 60;
      saveState();
      updateHeaderStatus();
      navigate('timer');
    }

    function completeTimerNow() {
      if (timerInterval) clearInterval(timerInterval);
      const mins = state.timer.presetMinutes;
      const xpEarned = mins * 2;
      state.timer.running = false;
      state.timer.secondsLeft = mins * 60;
      state.sessions.push({
        id: 's_' + Date.now(),
        date: new Date().toISOString().slice(0, 10),
        minutes: mins,
        skill: state.timer.focusSkill,
        xp: xpEarned,
        note: `${mins}-min focused study block`
      });
      awardXp(xpEarned, `${mins}m ${state.timer.focusSkill} Focus Session`, state.timer.focusSkill);
      navigate('timer');
    }

    function flipVocabCard() {
      vocabFlipped = !vocabFlipped;
      navigate('vocabulary');
    }

    function rateVocabCard(quality) {
      const card = state.vocab[vocabIndex % state.vocab.length];
      if (quality === 1) {
        card.mastery = Math.max(1, card.mastery - 1);
      } else if (quality === 2) {
        card.mastery = Math.min(5, card.mastery + 1);
        awardXp(10, `Reviewed "${card.word}"`, 'Vocabulary');
      } else {
        card.mastery = 5;
        awardXp(15, `Mastered "${card.word}"`, 'Vocabulary');
      }
      vocabIndex = (vocabIndex + 1) % state.vocab.length;
      vocabFlipped = false;
      saveState();
      navigate('vocabulary');
    }

    function addVocabWord(e) {
      e.preventDefault();
      const fd = new FormData(e.target);
      state.vocab.unshift({
        id: 'v_' + Date.now(),
        word: String(fd.get('word')).trim(),
        pos: 'term',
        topic: String(fd.get('topic') || 'Business').trim(),
        def: String(fd.get('def')).trim(),
        example: String(fd.get('example') || 'Applied in corporate TOEIC contexts.').trim(),
        level: state.profile.level,
        mastery: 1,
        nextDue: 0
      });
      vocabIndex = 0;
      vocabFlipped = false;
      saveState();
      showToast('Card Added', 'New vocabulary term added to your SRS deck.');
      navigate('vocabulary');
    }

    function answerGrammar(qId, optIdx) {
      if (grammarAnswers[qId] !== undefined) return;
      grammarAnswers[qId] = optIdx;
      const q = GRAMMAR_DRILLS.find((x) => x.id === qId);
      if (q) {
        if (optIdx === q.answer) {
          awardXp(20, 'Part 5 Grammar Drill Correct', 'Grammar');
        } else {
          state.mistakes.unshift({
            id: 'm_' + Date.now(),
            skill: 'Grammar',
            prompt: q.prompt,
            userAnswer: q.options[optIdx],
            correctAnswer: q.options[q.answer],
            note: q.explain,
            resolved: false,
            date: new Date().toISOString().slice(0, 10)
          });
          saveState();
        }
      }
      navigate('grammar');
    }

    function answerReading(rpId, qIdx, optIdx) {
      const key = `${rpId}_${qIdx}`;
      if (readingAnswers[key] !== undefined) return;
      readingAnswers[key] = optIdx;
      const rp = READING_PASSAGES.find((x) => x.id === rpId);
      if (rp) {
        const q = rp.questions[qIdx];
        if (optIdx === q.answer) {
          awardXp(25, 'Part 7 Reading Question Correct', 'Reading');
        } else {
          state.mistakes.unshift({
            id: 'm_' + Date.now(),
            skill: 'Reading',
            prompt: `${rp.title}: ${q.q}`,
            userAnswer: q.options[optIdx],
            correctAnswer: q.options[q.answer],
            note: 'Re-read passage details carefully for qualifying constraints.',
            resolved: false,
            date: new Date().toISOString().slice(0, 10)
          });
          saveState();
        }
      }
      navigate('reading');
    }

    function speakPrompt(ldId) {
      const ld = LISTENING_DRILLS.find((x) => x.id === ldId);
      if (!ld) return;
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const utter = new SpeechSynthesisUtterance(ld.transcript.replace(/^Audio Prompt:\s*/i, ''));
        utter.rate = 0.96;
        window.speechSynthesis.speak(utter);
        showToast('Playing Audio', 'Listening prompt synthesized via Web Speech API.');
      } else {
        showToast('Audio Unavailable', 'Speech synthesis is not supported in this browser.');
      }
    }

    function answerListening(ldId, optIdx) {
      if (listeningAnswers[ldId] !== undefined) return;
      listeningAnswers[ldId] = optIdx;
      const ld = LISTENING_DRILLS.find((x) => x.id === ldId);
      if (ld) {
        if (optIdx === ld.answer) {
          awardXp(25, `${ld.part} Correct`, 'Listening');
        } else {
          state.mistakes.unshift({
            id: 'm_' + Date.now(),
            skill: 'Listening',
            prompt: ld.question,
            userAnswer: ld.options[optIdx],
            correctAnswer: ld.options[ld.answer],
            note: ld.explain,
            resolved: false,
            date: new Date().toISOString().slice(0, 10)
          });
          saveState();
        }
      }
      navigate('listening');
    }

    function startDiagnosticExam(mode = 'placement') {
      examRunner = { mode, index: 0, correct: 0 };
      navigate('exams');
    }

    function submitExamStep(optIdx) {
      if (!examRunner) return;
      const q = DIAGNOSTIC_QUESTIONS[examRunner.index];
      if (optIdx === q.answer) {
        examRunner.correct += 1;
      } else {
        state.mistakes.unshift({
          id: 'm_' + Date.now(),
          skill: q.skill,
          prompt: q.prompt,
          userAnswer: q.options[optIdx],
          correctAnswer: q.options[q.answer],
          note: q.explain,
          resolved: false,
          date: new Date().toISOString().slice(0, 10)
        });
      }

      if (examRunner.index + 1 < DIAGNOSTIC_QUESTIONS.length) {
        examRunner.index += 1;
        navigate('exams');
      } else {
        const total = DIAGNOSTIC_QUESTIONS.length;
        const ratio = examRunner.correct / total;
        const estScore = Math.round((320 + ratio * 630) / 5) * 5;
        const lScore = Math.round((estScore * 0.52) / 5) * 5;
        const rScore = estScore - lScore;
        state.profile.estimatedToeic = estScore;
        state.examHistory.push({
          id: 'ex_' + Date.now(),
          date: new Date().toISOString().slice(0, 10),
          title: 'Adaptive TOEIC Placement Diagnostic',
          score: estScore,
          listening: lScore,
          reading: rScore,
          accuracy: `${Math.round(ratio * 100)}%`
        });
        examRunner = null;
        awardXp(120, `Placement Complete · Estimated ${estScore} TOEIC`);
        navigate('exams');
      }
    }

    function toggleMistakeResolved(mId) {
      const item = state.mistakes.find((m) => m.id === mId);
      if (!item) return;
      item.resolved = !item.resolved;
      if (item.resolved) {
        awardXp(25, 'Resolved Mistake Vault Item', item.skill);
      } else {
        saveState();
      }
      navigate('mistakes');
    }

    function exportStateJson() {
      const ta = document.createElement('textarea');
      ta.value = JSON.stringify(state, null, 2);
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      ta.remove();
      showToast('Backup Copied', 'JSON state copied to clipboard.');
    }

    function resetAllData() {
      localStorage.removeItem(STORAGE_KEY);
      state = defaultState();
      saveState();
      showToast('Reset Complete', 'Restored default TOEIC Learning Hub profile & Stage 3 world.');
      navigate('overview');
    }

    window.TLH = {
      navigate,
      openOnboardingModal,
      closeOnboardingModal,
      regenerateTasks,
      toggleTask,
      addCustomTask,
      selectWorldKind,
      previewWorldStage,
      cycleLighting,
      adjustWorldZoom,
      resetWorldCamera,
      awardXp,
      setTimerPreset,
      setTimerSkill,
      toggleTimer,
      resetTimer,
      completeTimerNow,
      flipVocabCard,
      rateVocabCard,
      addVocabWord,
      answerGrammar,
      answerReading,
      speakPrompt,
      answerListening,
      startDiagnosticExam,
      submitExamStep,
      toggleMistakeResolved,
      exportStateJson,
      resetAllData
    };

    window.addEventListener('DOMContentLoaded', () => {
      navigate(state.activePage || 'overview');
    });
  })();
  </script>
</body>
</html>
