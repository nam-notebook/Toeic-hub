        drawIsoPitchedRoof(bld.gx, bld.gy, 0.16 + bld.h * 0.54, bld.w * 0.96, bld.d * 0.96, bld.h * 0.36, '#334155', '#1e293b', '#94a3b8');
        drawIsoWindow(bld.gx, bld.gy + bld.d * 0.395, 0.25, 0.34, 0.28, true);
      } else if (arch === 'lighthouse') {
        drawIsoPrism(ctx, bld.gx, bld.gy, 0, bld.w * 0.92, bld.d * 0.92, 0.20, '#cbd5e1', '#94a3b8', '#64748b', originX, originY, tileW);
        const bands = 5;
        const bandH = (bld.h * 0.74) / bands;
        for (let i = 0; i < bands; i++) {
          const taper = 1 - i * 0.08;
          const isRed = i % 2 === 1;
          drawIsoPrism(
            ctx, bld.gx, bld.gy, 0.20 + i * bandH,
            bld.w * 0.64 * taper, bld.d * 0.64 * taper, bandH,
            isRed ? '#ef4444' : '#ffffff',
            isRed ? '#dc2626' : '#f1f5f9',
            isRed ? '#991b1b' : '#cbd5e1',
            originX, originY, tileW
          );
        }
        const lampZ = 0.20 + bands * bandH;
        const lampPt = isoProject(bld.gx, bld.gy, lampZ + 0.12, originX, originY, tileW);
        const beamAng = timeSec * 1.4;
        const beamDx = Math.cos(beamAng) * (isNight ? 95 : 68) * s;
        const beamDy = Math.sin(beamAng) * (isNight ? 42 : 28) * s;
        const beamGrad = ctx.createLinearGradient(lampPt.x, lampPt.y, lampPt.x + beamDx, lampPt.y + beamDy);
        beamGrad.addColorStop(0, isNight ? 'rgba(254, 240, 138, 0.92)' : 'rgba(254, 240, 138, 0.72)');
        beamGrad.addColorStop(1, 'rgba(254, 240, 138, 0.0)');
        ctx.fillStyle = beamGrad;
        ctx.beginPath();
        ctx.moveTo(lampPt.x, lampPt.y);
        ctx.lineTo(lampPt.x + beamDx - 12 * s, lampPt.y + beamDy - 15 * s);
        ctx.lineTo(lampPt.x + beamDx + 12 * s, lampPt.y + beamDy + 15 * s);
        ctx.closePath();
        ctx.fill();

        ctx.fillStyle = '#fef08a';
        ctx.beginPath();
        ctx.arc(lampPt.x, lampPt.y, 5.5 * s, 0, Math.PI * 2);
        ctx.fill();
        drawIsoPitchedRoof(bld.gx, bld.gy, lampZ + 0.18, bld.w * 0.56, bld.d * 0.56, 0.24, '#dc2626', '#991b1b', '#fef08a');
      } else if (arch === 'treehouse') {
        drawIsoPrism(ctx, bld.gx, bld.gy, 0, 0.44, 0.44, bld.h * 0.56, '#78350f', '#5c280b', '#3f1a06', originX, originY, tileW);
        const canopyPt = isoProject(bld.gx, bld.gy, bld.h * 0.58, originX, originY, tileW);
        ctx.fillStyle = '#15803d';
        ctx.beginPath();
        ctx.arc(canopyPt.x - 16 * s, canopyPt.y, 17 * s, 0, Math.PI * 2);
        ctx.arc(canopyPt.x + 16 * s, canopyPt.y, 17 * s, 0, Math.PI * 2);
        ctx.arc(canopyPt.x, canopyPt.y - 10 * s, 21 * s, 0, Math.PI * 2);
        ctx.fill();
        drawIsoPrism(ctx, bld.gx, bld.gy, bld.h * 0.50, bld.w * 0.74, bld.d * 0.70, bld.h * 0.28, '#fef3c7', '#d97706', '#92400e', originX, originY, tileW);
        drawIsoPitchedRoof(bld.gx, bld.gy, bld.h * 0.78, bld.w * 0.84, bld.d * 0.80, bld.h * 0.24, '#eab308', '#a16207', '#fef9c3');
      } else if (arch === 'tiki_hut') {
        drawIsoPrism(ctx, bld.gx, bld.gy, 0, bld.w * 0.88, bld.d * 0.88, bld.h * 0.54, '#fde68a', '#d97706', '#92400e', originX, originY, tileW);
        drawIsoPitchedRoof(bld.gx, bld.gy, bld.h * 0.54, bld.w * 0.96, bld.d * 0.96, bld.h * 0.42, '#eab308', '#ca8a04', '#fef08a');
      } else if (arch === 'biodome') {
        drawIsoPrism(ctx, bld.gx, bld.gy, 0, bld.w * 0.95, bld.d * 0.95, 0.18, '#e2e8f0', '#94a3b8', '#64748b', originX, originY, tileW);
        const domeCenter = isoProject(bld.gx, bld.gy, 0.18, originX, originY, tileW);
        const domeR = hw * 0.95;
        ctx.fillStyle = '#15803d';
        ctx.beginPath();
        ctx.arc(domeCenter.x, domeCenter.y - 4 * s, domeR * 0.52, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#22c55e';
        ctx.beginPath();
        ctx.arc(domeCenter.x - 4 * s, domeCenter.y - 8 * s, domeR * 0.38, 0, Math.PI * 2);
        ctx.fill();

        const glassGrad = ctx.createRadialGradient(domeCenter.x - domeR * 0.3, domeCenter.y - domeR * 0.5, 2, domeCenter.x, domeCenter.y, domeR);
        glassGrad.addColorStop(0, 'rgba(224, 242, 254, 0.72)');
        glassGrad.addColorStop(0.6, 'rgba(56, 189, 248, 0.30)');
        glassGrad.addColorStop(1, 'rgba(14, 116, 144, 0.48)');
        ctx.fillStyle = glassGrad;
        ctx.beginPath();
        ctx.arc(domeCenter.x, domeCenter.y, domeR, Math.PI, 0);
        ctx.closePath();
        ctx.fill();
        ctx.strokeStyle = '#bae6fd';
        ctx.lineWidth = 1.6 * s;
        ctx.stroke();
      } else if (arch === 'space_hub') {
        drawIsoPrism(ctx, bld.gx, bld.gy, 0, bld.w * 0.92, bld.d * 0.92, bld.h * 0.62, '#f8fafc', '#cbd5e1', '#94a3b8', originX, originY, tileW);
        drawIsoPrism(ctx, bld.gx, bld.gy, bld.h * 0.40, bld.w * 0.96, bld.d * 0.96, 0.10, '#7dd3fc', '#38bdf8', '#0284c7', originX, originY, tileW);
        drawIsoPrism(ctx, bld.gx, bld.gy, bld.h * 0.62, bld.w * 0.58, bld.d * 0.58, bld.h * 0.26, '#e2e8f0', '#94a3b8', '#64748b', originX, originY, tileW);
      } else if (arch === 'rocket_launchpad') {
        drawIsoPrism(ctx, bld.gx, bld.gy, 0, bld.w * 1.0, bld.d * 1.0, 0.22, '#94a3b8', '#64748b', '#475569', originX, originY, tileW);
        const rBase = isoProject(bld.gx - 0.1, bld.gy + 0.1, 0.22, originX, originY, tileW);
        const rH = bh * 0.88;
        ctx.fillStyle = '#f8fafc';
        ctx.fillRect(rBase.x - 8 * s, rBase.y - rH, 16 * s, rH);
        ctx.fillStyle = '#ef4444';
        ctx.beginPath();
        ctx.moveTo(rBase.x, rBase.y - rH - 15 * s);
        ctx.lineTo(rBase.x - 8 * s, rBase.y - rH);
        ctx.lineTo(rBase.x + 8 * s, rBase.y - rH);
        ctx.closePath();
        ctx.fill();
        ctx.fillStyle = '#dc2626';
        ctx.beginPath();
        ctx.moveTo(rBase.x - 8 * s, rBase.y - 12 * s);
        ctx.lineTo(rBase.x - 16 * s, rBase.y);
        ctx.lineTo(rBase.x - 8 * s, rBase.y);
        ctx.moveTo(rBase.x + 8 * s, rBase.y - 12 * s);
        ctx.lineTo(rBase.x + 16 * s, rBase.y);
        ctx.lineTo(rBase.x + 8 * s, rBase.y);
        ctx.fill();
        ctx.strokeStyle = '#f59e0b';
        ctx.lineWidth = 2.4 * s;
        ctx.strokeRect(rBase.x + 12 * s, rBase.y - rH * 0.9, 6 * s, rH * 0.9);
      } else if (arch.startsWith('market_stall')) {
        const awCol = arch.includes('teal') ? '#0d9488' : arch.includes('gold') ? '#eab308' : '#ea580c';
        const awDark = arch.includes('teal') ? '#115e59' : arch.includes('gold') ? '#a16207' : '#9a3412';
        drawIsoPrism(ctx, bld.gx, bld.gy, 0, bld.w * 0.88, bld.d * 0.84, bld.h * 0.44, '#fde68a', '#b45309', '#78350f', originX, originY, tileW);
        drawIsoPitchedRoof(bld.gx, bld.gy, bld.h * 0.68, bld.w * 0.96, bld.d * 0.94, bld.h * 0.28, awCol, awDark, '#ffffff');
      } else if (arch === 'thai_shophouse') {
        drawIsoPrism(ctx, bld.gx, bld.gy, 0, bld.w * 0.92, bld.d * 0.88, bld.h * 0.72, '#fef3c7', '#b45309', '#78350f', originX, originY, tileW);
        drawIsoWindow(bld.gx - 0.2, bld.gy + bld.d * 0.445, 0.56, 0.24, 0.24, true);
        drawIsoWindow(bld.gx + 0.2, bld.gy + bld.d * 0.445, 0.56, 0.24, 0.24, true);
        drawIsoPitchedRoof(bld.gx, bld.gy, bld.h * 0.72, bld.w * 0.98, bld.d * 0.96, bld.h * 0.30, '#dc2626', '#991b1b', '#fbbf24');
      } else if (arch === 'treasure_chest') {
        drawIsoPrism(ctx, bld.gx, bld.gy, 0, bld.w * 0.84, bld.d * 0.74, bld.h * 0.52, '#fde047', '#92400e', '#78350f', originX, originY, tileW);
        const openGlow = ctx.createRadialGradient(base.x, base.y - 12 * s, 2, base.x, base.y - 12 * s, 24 * s);
        openGlow.addColorStop(0, 'rgba(254, 240, 138, 0.95)');
        openGlow.addColorStop(1, 'rgba(254, 240, 138, 0)');
        ctx.fillStyle = openGlow;
        ctx.beginPath();
        ctx.arc(base.x, base.y - 12 * s, 24 * s, 0, Math.PI * 2);
        ctx.fill();
        drawIsoPrism(ctx, bld.gx, bld.gy - 0.14, bld.h * 0.52, bld.w * 0.84, bld.d * 0.68, bld.h * 0.28, '#b45309', '#78350f', '#451a03', originX, originY, tileW);
      } else if (arch === 'pirate_ship') {
        drawIsoPrism(ctx, bld.gx, bld.gy, 0, bld.w * 0.92, bld.d * 0.74, bld.h * 0.36, '#92400e', '#78350f', '#451a03', originX, originY, tileW);
        drawIsoPrism(ctx, bld.gx - 0.36, bld.gy, bld.h * 0.36, bld.w * 0.36, bld.d * 0.70, bld.h * 0.22, '#b45309', '#92400e', '#78350f', originX, originY, tileW);
        const mastBase = isoProject(bld.gx + 0.05, bld.gy, bld.h * 0.36, originX, originY, tileW);
        ctx.strokeStyle = '#451a03';
        ctx.lineWidth = 3.2 * s;
        ctx.beginPath();
        ctx.moveTo(mastBase.x, mastBase.y);
        ctx.lineTo(mastBase.x + 4 * s, mastBase.y - 34 * s);
        ctx.stroke();
        ctx.fillStyle = '#fef3c7';
        ctx.beginPath();
        ctx.moveTo(mastBase.x + 2 * s, mastBase.y - 30 * s);
        ctx.quadraticCurveTo(mastBase.x + 18 * s, mastBase.y - 20 * s, mastBase.x + 2 * s, mastBase.y - 10 * s);
        ctx.closePath();
        ctx.fill();
      } else if (arch === 'glass_skyscraper' || arch === 'glass_tower') {
        drawIsoPrism(ctx, bld.gx, bld.gy, 0, bld.w * 0.88, bld.d * 0.88, bld.h * 0.94, '#e0f2fe', '#38bdf8', '#0284c7', originX, originY, tileW, '#bae6fd');
        const floors = arch === 'glass_skyscraper' ? 6 : 3;
        for (let fl = 1; fl < floors; fl++) {
          const fz = (fl / floors) * (bld.h * 0.90);
          drawIsoWindow(bld.gx - 0.18, bld.gy + bld.d * 0.445, fz, 0.20, 0.14, true);
          drawIsoWindow(bld.gx + 0.18, bld.gy + bld.d * 0.445, fz, 0.20, 0.14, true);
          drawIsoWindow(bld.gx + bld.w * 0.445, bld.gy, fz, 0.24, 0.14, false);
        }
        drawIsoPrism(ctx, bld.gx, bld.gy, bld.h * 0.94, bld.w * 0.72, bld.d * 0.72, 0.08, '#4ade80', '#16a34a', '#15803d', originX, originY, tileW);
      } else if (arch === 'telecom_spire') {
        drawIsoPrism(ctx, bld.gx, bld.gy, 0, bld.w * 0.74, bld.d * 0.74, bld.h * 0.56, '#e2e8f0', '#94a3b8', '#64748b', originX, originY, tileW);
        drawIsoPrism(ctx, bld.gx, bld.gy, bld.h * 0.56, bld.w * 0.96, bld.d * 0.96, 0.16, '#7dd3fc', '#0284c7', '#0369a1', originX, originY, tileW);
        const spireBase = isoProject(bld.gx, bld.gy, bld.h * 0.72, originX, originY, tileW);
        ctx.strokeStyle = '#f8fafc';
        ctx.lineWidth = 3.0 * s;
        ctx.beginPath();
        ctx.moveTo(spireBase.x, spireBase.y);
        ctx.lineTo(spireBase.x, spireBase.y - 32 * s);
        ctx.stroke();
        const beacon = 0.4 + 0.6 * Math.abs(Math.sin(timeSec * 3.5));
        ctx.fillStyle = `rgba(244, 63, 94, ${beacon.toFixed(2)})`;
        ctx.beginPath();
        ctx.arc(spireBase.x, spireBase.y - 33 * s, 3.6 * s, 0, Math.PI * 2);
        ctx.fill();
      } else if (arch.startsWith('heartwood')) {
        const trunkW = arch === 'heartwood_grand' ? 0.62 : 0.48;
        drawIsoPrism(ctx, bld.gx, bld.gy, 0, trunkW, trunkW, bld.h * 0.62, '#78350f', '#5c280b', '#3f1a06', originX, originY, tileW);
        const winPt = isoProject(bld.gx, bld.gy + trunkW * 0.51, 0.34, originX, originY, tileW);
        ctx.fillStyle = '#fde047';
        ctx.beginPath();
        ctx.arc(winPt.x, winPt.y, 4.8 * s, 0, Math.PI * 2);
        ctx.fill();
        const canopyPt = isoProject(bld.gx, bld.gy, bld.h * 0.66, originX, originY, tileW);
        const rCan = (arch === 'heartwood_grand' ? 28 : 22) * s;
        ctx.fillStyle = '#15803d';
        ctx.beginPath();
        ctx.arc(canopyPt.x - rCan * 0.6, canopyPt.y, rCan * 0.72, 0, Math.PI * 2);
        ctx.arc(canopyPt.x + rCan * 0.6, canopyPt.y, rCan * 0.72, 0, Math.PI * 2);
        ctx.arc(canopyPt.x, canopyPt.y - rCan * 0.35, rCan * 0.88, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#facc15';
        ctx.beginPath();
        ctx.arc(canopyPt.x - 4 * s, canopyPt.y - rCan * 0.45, rCan * 0.52, 0, Math.PI * 2);
        ctx.fill();
      } else if (arch === 'waterwheel_mill') {
        drawIsoPrism(ctx, bld.gx, bld.gy, 0, bld.w * 0.86, bld.d * 0.84, bld.h * 0.58, '#fef3c7', '#d97706', '#92400e', originX, originY, tileW);
        drawIsoPitchedRoof(bld.gx, bld.gy, bld.h * 0.58, bld.w * 0.94, bld.d * 0.92, bld.h * 0.34, '#c2410c', '#7c2d12', '#fef3c7');
        const wheelPt = isoProject(bld.gx - bld.w * 0.48, bld.gy + 0.1, 0.32, originX, originY, tileW);
        ctx.save();
        ctx.translate(wheelPt.x, wheelPt.y);
        ctx.rotate(timeSec * 1.4);
        ctx.strokeStyle = '#78350f';
        ctx.lineWidth = 2.6 * s;
        ctx.beginPath();
        ctx.arc(0, 0, 12 * s, 0, Math.PI * 2);
        ctx.moveTo(-12 * s, 0); ctx.lineTo(12 * s, 0);
        ctx.moveTo(0, -12 * s); ctx.lineTo(0, 12 * s);
        ctx.stroke();
        ctx.restore();
      } else {
        drawIsoPrism(ctx, bld.gx, bld.gy, 0, bld.w * 0.88, bld.d * 0.86, bld.h * 0.56, '#faf0dc', '#ebd5b3', '#cbb089', originX, originY, tileW);
        drawIsoPitchedRoof(bld.gx, bld.gy, bld.h * 0.56, bld.w * 0.96, bld.d * 0.94, bld.h * 0.34, cfg.roofPrimary, shadeColor(cfg.roofPrimary, 0.74), '#fef3c7');
        drawIsoWindow(bld.gx, bld.gy + bld.d * 0.435, 0.24, 0.24, 0.22, true);
      }

      if (isHovered || pulseStrength > 0.02) {
        ctx.strokeStyle = isHovered ? 'rgba(255, 248, 214, 0.95)' : `rgba(255, 232, 145, ${(pulseStrength * 0.85).toFixed(2)})`;
        ctx.lineWidth = isHovered ? 2.4 : 2.0;
        ctx.beginPath();
        ctx.ellipse(base.x, base.y + 1.5 * s, hw * 1.18, hd * 1.18, 0, 0, Math.PI * 2);
        ctx.stroke();
      }

      ctx.restore();

      return {
        id: bld.id,
        name: bld.name,
        category: bld.category,
        lore: bld.lore,
        x: base.x - hw * 1.15,
        y: base.y - bh * 1.22,
        w: hw * 2.3,
        h: bh * 1.35 + hd
      };
    }

    const instances = new Map();
    const state = {
      kind: 'tree',
      stage: 0,
      frac: 0,
      lightingMode: 'day',
      levelUp: null
    };

    let rafId = null;

    function ensureLoop() {
      if (rafId !== null) return;
      function tick(now) {
        const timeSec = now * 0.001;
        instances.forEach((inst) => {
          if (!inst.canvas || !inst.canvas.isConnected) return;
          const rect = inst.canvas.getBoundingClientRect();
          if (rect.width < 2 || rect.height < 2) return;
          const dpr = Math.min(window.devicePixelRatio || 1, 2);
          const targetW = Math.round(rect.width * dpr);
          const targetH = Math.round(rect.height * dpr);
          if (inst.canvas.width !== targetW || inst.canvas.height !== targetH) {
            inst.canvas.width = targetW;
            inst.canvas.height = targetH;
          }
          const ctx = inst.canvas.getContext('2d');
          ctx.save();
          ctx.scale(dpr, dpr);
          const hitBoxes = renderSceneFrame(
            ctx,
            rect.width,
            rect.height,
            inst.scene,
            timeSec,
            inst.hoverId,
            state.levelUp,
            inst.isThumb,
            inst.pan,
            inst.zoom,
            state.lightingMode
          );
          ctx.restore();
          inst.hitBoxes = hitBoxes;
        });
        rafId = requestAnimationFrame(tick);
      }
      rafId = requestAnimationFrame(tick);
    }

    function bindMainCanvasInteractions(inst) {
      const canvas = inst.canvas;
      if (canvas.__gwBound) return;
      canvas.__gwBound = true;

      let dragging = false;
      let startX = 0;
      let startY = 0;

      // Floating Zoom Control Bar inside the 2.5D frame
      const frame = canvas.parentElement;
      if (frame && !frame.querySelector('.gw-zoom-controls')) {
        const bar = document.createElement('div');
        bar.className = 'gw-zoom-controls absolute top-3 right-3 z-20 flex items-center gap-1 glass-dark px-2 py-1 rounded-xl text-[11px] font-semibold shadow-lg';
        bar.innerHTML = `
          <button type="button" data-zoom="out" title="Zoom Out" class="w-6 h-6 rounded-lg hover:bg-white/15 flex items-center justify-center transition">−</button>
          <span data-zoom="label" class="px-1.5 min-w-[42px] text-center text-amber-200">100%</span>
          <button type="button" data-zoom="in" title="Zoom In" class="w-6 h-6 rounded-lg hover:bg-white/15 flex items-center justify-center transition">+</button>
          <button type="button" data-zoom="reset" title="Reset View" class="ml-0.5 px-1.5 h-6 rounded-lg hover:bg-white/15 text-[10px] text-stone-300 transition">Reset</button>
        `;
        const lbl = bar.querySelector('[data-zoom="label"]');
        const updateLabel = () => {
          lbl.textContent = `${Math.round(inst.zoom * 100)}%`;
        };
        bar.addEventListener('click', (ev) => {
          ev.stopPropagation();
          const btn = ev.target.closest('button');
          if (!btn) return;
          const act = btn.getAttribute('data-zoom');
          if (act === 'in') inst.zoom = clamp(inst.zoom + 0.15, 0.5, 2.2);
          if (act === 'out') inst.zoom = clamp(inst.zoom - 0.15, 0.5, 2.2);
          if (act === 'reset') {
            inst.zoom = 1.0;
            inst.pan = { x: 0, y: 0 };
          }
          updateLabel();
        });
        canvas.__updateZoomLabel = updateLabel;
        frame.appendChild(bar);
      }

      canvas.addEventListener('wheel', (e) => {
        e.preventDefault();
        const delta = e.deltaY < 0 ? 0.10 : -0.10;
        inst.zoom = clamp(inst.zoom + delta, 0.5, 2.2);
        if (canvas.__updateZoomLabel) canvas.__updateZoomLabel();
      }, { passive: false });

      canvas.addEventListener('pointerdown', (e) => {
        dragging = true;
        startX = e.clientX - inst.pan.x;
        startY = e.clientY - inst.pan.y;
        canvas.setPointerCapture(e.pointerId);
      });

      canvas.addEventListener('pointermove', (e) => {
        const rect = canvas.getBoundingClientRect();
        const mx = e.clientX - rect.left;
        const my = e.clientY - rect.top;

        if (dragging) {
          inst.pan.x = clamp(e.clientX - startX, -220, 220);
          inst.pan.y = clamp(e.clientY - startY, -160, 160);
          return;
        }

        let found = null;
        for (let i = inst.hitBoxes.length - 1; i >= 0; i--) {
          const hb = inst.hitBoxes[i];
          if (mx >= hb.x && mx <= hb.x + hb.w && my >= hb.y && my <= hb.y + hb.h) {
            found = hb;
            break;
          }
        }
        inst.hoverId = found ? found.id : null;
        canvas.classList.toggle('is-hovering', Boolean(found));
        if (typeof inst.onHover === 'function') {
          inst.onHover(found, mx, my);
        }
      });

      canvas.addEventListener('pointerup', (e) => {
        dragging = false;
        if (canvas.hasPointerCapture(e.pointerId)) {
          canvas.releasePointerCapture(e.pointerId);
        }
      });

      canvas.addEventListener('pointerleave', () => {
        dragging = false;
        inst.hoverId = null;
        canvas.classList.remove('is-hovering');
        if (typeof inst.onHover === 'function') {
          inst.onHover(null, 0, 0);
        }
      });
    }

    const World = {
      KINDS,
      STAGE_NAMES,

      stageName(stage) {
        const idx = clamp(Math.floor(Number(stage) || 0), 0, STAGE_NAMES.length - 1);
        return STAGE_NAMES[idx];
      },

      stageNames() {
        return [...STAGE_NAMES];
      },

      kinds() {
        return [...KINDS];
      },

      getThemeMeta(kind) {
        const cfg = resolveTheme(kind);
        return {
          kind,
          canonical: cfg.canonical,
          title: cfg.title
        };
      },

      setLightingMode(mode) {
        if (['day', 'sunset', 'night'].includes(mode)) {
          state.lightingMode = mode;
        }
      },

      getLightingMode() {
        return state.lightingMode;
      },

      triggerLevelUp(newStage) {
        const s = clamp(Math.floor(Number(newStage) || 0), 0, 7);
        state.levelUp = {
          startedAt: performance.now(),
          stage: s,
          label: `STAGE ${s} · ${STAGE_NAMES[s].toUpperCase()}!`
        };
      },

      render(canvas, kind, stage, frac, options = {}) {
        if (!canvas) return;
        const k = kind || state.kind;
        const s = clamp(Math.floor(Number(stage) || 0), 0, 7);
        const f = clamp(Number(frac) || 0, 0, 1);

        if (s > state.stage && k === state.kind && !options.silent) {
          World.triggerLevelUp(s);
        }

        state.kind = k;
        state.stage = s;
        state.frac = f;
        if (options.lightingMode) {
          state.lightingMode = options.lightingMode;
        }

        const existing = instances.get(canvas);
        const scene = buildSceneData(k, s, f);
        const inst = existing || {
          canvas,
          isThumb: false,
          hoverId: null,
          hitBoxes: [],
          pan: { x: 0, y: 0 },
          zoom: 0.5,
          onHover: options.onHover || null
        };
        inst.scene = scene;
        if (options.onHover) inst.onHover = options.onHover;
        instances.set(canvas, inst);

        bindMainCanvasInteractions(inst);
        ensureLoop();

        return {
          themeTitle: scene.cfg.title,
          stageName: STAGE_NAMES[s],
          buildings: scene.buildings.map((b) => ({
            id: b.id,
            name: b.name,
            category: b.category,
            lore: b.lore,
            unlockStage: b.unlockStage
          }))
        };
      },

      thumb(canvas, kind, stage) {
        if (!canvas) return;
        const k = kind || 'tree';
        const s = clamp(Math.floor(Number(stage) || 0), 0, 7);
        const scene = buildSceneData(k, s, 0.5);

        const existing = instances.get(canvas);
        const inst = existing || {
          canvas,
          isThumb: true,
          hoverId: null,
          hitBoxes: [],
          pan: { x: 0, y: 0 },
          zoom: 1.0,
          onHover: null
        };
        inst.scene = scene;
        instances.set(canvas, inst);
        ensureLoop();
      }
    };

    global.World = World;
  })(window);
  </script>

      for (let i = STAGE_MILESTONES.length - 1; i >= 0; i--) {
        if (xp >= STAGE_MILESTONES[i].xp) {
          computedStage = STAGE_MILESTONES[i].stage;
          break;
        }
      }
      const stage = appState.worldConfig.stageOverride !== null && appState.worldConfig.stageOverride !== undefined
        ? Number(appState.worldConfig.stageOverride)
        : computedStage;

      const curMilestone = STAGE_MILESTONES[stage] || STAGE_MILESTONES[0];
      const nextMilestone = STAGE_MILESTONES[Math.min(7, stage + 1)];
      let frac = 1;
      if (stage < 7 && nextMilestone.xp > curMilestone.xp) {
        frac = Math.max(0, Math.min(1, (xp - curMilestone.xp) / (nextMilestone.xp - curMilestone.xp)));
      }
      return {
        xp,
        stage,
        frac,
        curMilestone,
        nextMilestone,
        xpToNext: stage < 7 ? Math.max(0, nextMilestone.xp - xp) : 0
      };
    }

    function awardXp(amount, reason) {
      const prev = computeWorldProgress().stage;
      appState.worldConfig.xp = Math.max(0, (Number(appState.worldConfig.xp) || 0) + amount);
      appState.worldConfig.stageOverride = null;
      const next = computeWorldProgress().stage;
      saveState();
      if (next > prev && global.World) {
        global.World.triggerLevelUp(next);
        showToast(`Stage Up! Reached Stage ${next}: ${global.World.stageName(next)} (+${amount} XP)`, 'success');
      } else if (reason) {
        showToast(`${reason} (+${amount} Growth XP)`, 'info');
      }
      updateHeaderStatus();
    }

    function showToast(message, type = 'info') {
      const container = document.getElementById('tlh-toast-container');
      if (!container) return;
      const el = document.createElement('div');
      const bg = type === 'success'
        ? 'bg-emerald-900 text-emerald-50 border-emerald-500/50'
        : type === 'warn'
        ? 'bg-amber-900 text-amber-50 border-amber-500/50'
        : 'bg-slate-900 text-stone-100 border-amber-300/30';
      el.className = `pointer-events-auto px-4 py-2.5 rounded-xl border shadow-xl text-xs font-medium transition-all duration-300 ${bg}`;
      el.textContent = message;
      container.appendChild(el);
      setTimeout(() => {
        el.style.opacity = '0';
        el.style.transform = 'translateY(6px)';
        setTimeout(() => el.remove(), 300);
      }, 3200);
    }

    // StudySession Timer Engine
    const StudySession = {
      running: false,
      mode: 'Pomodoro',
      topic: 'TOEIC Reading & Grammar Focus',
      skill: 'Reading',
      targetSeconds: 25 * 60,
      elapsedSeconds: 0,
      intervalId: null,

      start(customMinutes, topic, skill, mode) {
        if (customMinutes) {
          this.targetSeconds = Math.max(60, Math.round(customMinutes * 60));
        }
        if (topic) this.topic = topic;
        if (skill) this.skill = skill;
        if (mode) this.mode = mode;

        if (this.running) return;
        this.running = true;
        this.intervalId = setInterval(() => {
          this.elapsedSeconds += 1;
          updateTimerUI();
          if (this.elapsedSeconds >= this.targetSeconds) {
            this.completeSession();
          }
        }, 1000);
        updateTimerUI();
      },

      pause() {
        this.running = false;
        if (this.intervalId) {
          clearInterval(this.intervalId);
          this.intervalId = null;
        }
        updateTimerUI();
      },

      reset() {
        this.pause();
        this.elapsedSeconds = 0;
        updateTimerUI();
      },

      completeSession(manualMinutes = null) {
        this.pause();
        const mins = manualMinutes !== null
          ? Math.max(1, Math.round(manualMinutes))
          : Math.max(1, Math.round(this.elapsedSeconds / 60));
        const xpRate = Number(appState.settings.autoXpPerMinute) || 2;
        const xpEarned = Math.max(15, mins * xpRate);

        appState.sessions.unshift({
          id: 'sess_' + Date.now(),
          date: todayISO(),
          topic: this.topic || 'Focused Study Session',
          skill: this.skill || 'General',
          minutes: mins,
          xpEarned,
          mode: this.mode || 'Focus'
        });

        const studyGoal = appState.goals.find((g) => g.id === 'g2');
        if (studyGoal) {
          studyGoal.current += mins;
          if (studyGoal.current >= studyGoal.target) studyGoal.completed = true;
        }

        this.elapsedSeconds = 0;
        awardXp(xpEarned, `Completed ${mins}m ${this.skill} session`);
        if (global.World) {
          global.World.triggerLevelUp(computeWorldProgress().stage);
        }
        if (appState.currentPage === 'timer' || appState.currentPage === 'dashboard' || appState.currentPage === 'world') {

        }
      }
    };

      const s = Math.max(0, Math.floor(totalSec));

      return `${mm}:${ss}`;

      const displayEl = document.getElementById('timer-clock-display');
      if (displayEl) {

      const elapsedEl = document.getElementById('timer-elapsed-label');

                  </div>
                `;
              }).join('')}
            </div>
          </div>
        </div>
      `;
    }

    function renderHistoryPage() {
      return `
        <div class="space-y-6">
          <div class="tlh-card p-6">
            <span class="text-xs font-semibold uppercase tracking-wider text-indigo-700">Activity Ledger</span>
            <h2 class="font-display text-xl font-bold text-slate-900 mt-0.5">Study Session History</h2>
          </div>

          <div class="tlh-card p-5 space-y-2.5">
            ${appState.sessions.map((s) => `
              <div class="p-3.5 rounded-xl border border-slate-900/10 bg-stone-50/70 flex flex-wrap items-center justify-between gap-2">
                <div>
                  <div class="text-xs font-bold text-slate-900">${s.topic}</div>
                  <div class="text-[11px] text-slate-500">${s.date} · ${s.skill} · ${s.mode}</div>
                </div>
                <div class="flex items-center gap-2">
                  <span class="px-2.5 py-1 rounded-lg bg-white border border-slate-200 text-xs font-semibold text-slate-800">${s.minutes} min</span>
                  <span class="px-2.5 py-1 rounded-lg bg-amber-100 text-amber-900 text-xs font-bold">+${s.xpEarned} XP</span>
                </div>
              </div>
            `).join('')}
          </div>
        </div>
      `;
    }

    function renderGoalsPage() {
      return `
        <div class="space-y-6">
          <div class="tlh-card p-6 flex flex-wrap items-center justify-between gap-4">
            <div>
              <span class="text-xs font-semibold uppercase tracking-wider text-indigo-700">Milestones & Targets</span>
              <h2 class="font-display text-xl font-bold text-slate-900 mt-0.5">Personal Learning Goals</h2>
            </div>
            <button type="button" onclick="TLH.openOnboardingModal()" class="px-4 py-2 rounded-xl bg-indigo-800 hover:bg-indigo-900 text-white text-xs font-semibold shadow transition">
              Edit Target Score & Date
            </button>
          </div>

          <div class="grid grid-cols-1 md:grid-cols-3 gap-5">
            ${appState.goals.map((g) => {
              const pct = Math.min(100, Math.round((g.current / Math.max(1, g.target)) * 100));
              return `
                <div class="tlh-card p-5 flex flex-col justify-between space-y-4">
                  <div>
                    <span class="text-[10px] font-bold uppercase tracking-wider text-indigo-700">${g.category}</span>
                    <h3 class="font-display text-sm font-bold text-slate-900 mt-1">${g.title}</h3>
                    <div class="mt-3 flex justify-between text-xs font-semibold text-slate-700">
                      <span>${g.current} / ${g.target} ${g.unit}</span>
                      <span>${pct}%</span>
                    </div>
                    <div class="w-full h-2.5 rounded-full bg-stone-200 overflow-hidden mt-1.5">
                      <div class="h-full bg-emerald-600 rounded-full" style="width: ${pct}%"></div>
                    </div>
                  </div>
                  <button type="button" onclick="TLH.boostGoalProgress('${g.id}')" class="w-full py-2 rounded-xl bg-stone-100 hover:bg-stone-200 text-xs font-semibold text-slate-800 transition">
                    Log Progress Milestone (+20 XP)
                  </button>
                </div>
              `;
            }).join('')}
          </div>
        </div>
      `;
    }

    function renderSettingsPage() {
      return `
        <div class="space-y-6 max-w-3xl">
          <div class="tlh-card p-6">
            <span class="text-xs font-semibold uppercase tracking-wider text-indigo-700">Workspace & Data Controls</span>
            <h2 class="font-display text-xl font-bold text-slate-900 mt-0.5">Application Settings</h2>
          </div>

          <div class="tlh-card p-6 space-y-4">
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
              <div>
                <label class="block text-xs font-semibold text-slate-700 mb-1">Default Pomodoro Duration (min)</label>
                <input type="number" min="5" max="120" value="${appState.settings.pomodoroMinutes}" onchange="TLH.updateSetting('pomodoroMinutes', Number(this.value))" class="w-full px-3 py-2 rounded-xl border border-slate-300 bg-white text-sm" />
              </div>
              <div>
                <label class="block text-xs font-semibold text-slate-700 mb-1">Growth XP per Study Minute</label>
                <input type="number" min="1" max="20" value="${appState.settings.autoXpPerMinute}" onchange="TLH.updateSetting('autoXpPerMinute', Number(this.value))" class="w-full px-3 py-2 rounded-xl border border-slate-300 bg-white text-sm" />
              </div>
            </div>

            <div class="pt-4 border-t border-slate-900/10 flex flex-wrap items-center justify-between gap-3">
              <button type="button" onclick="TLH.exportStateJson()" class="px-4 py-2 rounded-xl bg-indigo-800 hover:bg-indigo-900 text-white text-xs font-semibold transition">
                Copy Progress JSON Backup
              </button>
              <button type="button" onclick="TLH.resetDemoData()" class="px-4 py-2 rounded-xl bg-rose-100 hover:bg-rose-200 text-rose-900 text-xs font-semibold transition">
                Reset All Data to Default
              </button>
            </div>
          </div>
        </div>
      `;
    }

    function renderCurrentPage() {
      const root = document.getElementById('page-root');
      if (!root) return;

      const p = appState.currentPage;
      if (p === 'dashboard') root.innerHTML = renderDashboardPage();
      else if (p === 'plan') root.innerHTML = renderPlanPage();
      else if (p === 'timer') root.innerHTML = renderTimerPage();
      else if (p === 'world') root.innerHTML = renderWorldPage();
      else if (p === 'toeic') root.innerHTML = renderToeicPage();
      else if (p === 'skills') root.innerHTML = renderSkillsPage();
      else if (p === 'exams') root.innerHTML = renderExamsPage();
      else if (p === 'vocab') root.innerHTML = renderVocabPage();
      else if (p === 'mistakes') root.innerHTML = renderMistakesPage();
      else if (p === 'analytics') root.innerHTML = renderAnalyticsPage();
      else if (p === 'history') root.innerHTML = renderHistoryPage();
      else if (p === 'goals') root.innerHTML = renderGoalsPage();
      else if (p === 'settings') root.innerHTML = renderSettingsPage();

      // Mount active 2.5D canvases after DOM insertion
      if (p === 'dashboard') {
        mountMainWorldCanvas('dash-world-canvas', 'dash-world-hint');
      } else if (p === 'timer') {
        mountMainWorldCanvas('timer-world-canvas', 'timer-world-hint');
      } else if (p === 'world') {
        mountMainWorldCanvas('studio-world-canvas', 'studio-world-hint');
        const wp = computeWorldProgress();
        WORLD_CATALOG.forEach((item) => {
          const tc = document.getElementById(`thumb-world-${item.kind}`);
          if (tc && global.World) {
            global.World.thumb(tc, item.kind, wp.stage);
          }
        });
      }
    }

    // -----------------------------------------------------------------------
    // PUBLIC CONTROLLER API (TLH)
    // -----------------------------------------------------------------------

    const TLH = {
      navigate,

      togglePlanTask(taskId) {
        const task = appState.plan.tasks.find((t) => t.id === taskId);
        if (!task) return;
        task.completed = !task.completed;
        saveState();
        if (task.completed) {
          awardXp(task.xpReward, `Completed "${task.title}"`);
        }
        renderCurrentPage();
      },

      regeneratePlan() {
        const today = todayISO();
        const w = (appState.profile.weaknesses || '').toLowerCase();
        const focusGrammar = w.includes('part 5') || w.includes('grammar') || w.includes('clause');
        appState.plan.generatedAt = today;
        appState.plan.tasks = [
          { id: 't_' + Date.now() + '_1', dayOffset: 0, title: focusGrammar ? 'Targeted Part 5 Clauses & Prepositions Drill' : 'TOEIC Grammar & Word Form Mastery', category: 'Grammar', minutes: 15, completed: false, xpReward: 40 },
          { id: 't_' + Date.now() + '_2', dayOffset: 0, title: 'SRS Vocabulary Active Recall (10 Terms)', category: 'Vocabulary', minutes: 10, completed: false, xpReward: 25 },
          { id: 't_' + Date.now() + '_3', dayOffset: 0, title: 'Part 7 Cross-Passage Inference Sprint', category: 'Reading', minutes: 20, completed: false, xpReward: 45 },
          { id: 't_' + Date.now() + '_4', dayOffset: 1, title: 'Listening Part 2 & 3 Paraphrase Drill', category: 'Listening', minutes: 15, completed: false, xpReward: 35 },
          { id: 't_' + Date.now() + '_5', dayOffset: 1, title: 'TOEIC 10-Question Timed Mini Mock', category: 'TOEIC Mock', minutes: 15, completed: false, xpReward: 55 },
          { id: 't_' + Date.now() + '_6', dayOffset: 2, title: 'Mistake Notebook Error Elimination Review', category: 'Review', minutes: 15, completed: false, xpReward: 35 }
        ];
        saveState();
        showToast('Adaptive study plan regenerated for your profile.', 'success');
        renderCurrentPage();
      },

      setTimerPreset(mins) {
        StudySession.pause();
        StudySession.elapsedSeconds = 0;
        StudySession.targetSeconds = mins * 60;
        updateTimerUI();
      },

      startTimer() {
        const topicEl = document.getElementById('timer-topic-input');
        const skillEl = document.getElementById('timer-skill-select');
        StudySession.start(
          null,
          topicEl ? topicEl.value : StudySession.topic,
          skillEl ? skillEl.value : StudySession.skill,
          'Pomodoro'
        );
      },

      selectWorldKind(kind) {
        appState.worldConfig.selectedKind = kind;
        saveState();
        updateHeaderStatus();
        renderCurrentPage();
      },

      setWorldLighting(mode) {
        appState.worldConfig.lightingMode = mode;
        saveState();
        if (global.World) {
          global.World.setLightingMode(mode);
        }
        renderCurrentPage();
      },

      testLevelUpEffect() {
        const wp = computeWorldProgress();
        if (global.World) {
          global.World.triggerLevelUp(wp.stage);
        }
        showToast(`Triggered Stage ${wp.stage} Celebration Burst!`, 'success');
      },

      previewWorldStage(stage) {
        appState.worldConfig.stageOverride = stage;
        saveState();
        if (global.World) {
          global.World.triggerLevelUp(stage);
        }
        renderCurrentPage();
      },

      clearStageOverride() {
        appState.worldConfig.stageOverride = null;
        saveState();
        renderCurrentPage();
      },

      awardBonusXp() {
        awardXp(150, 'Bonus World Evolution Boost');
        renderCurrentPage();
      },

      checkModuleDrill(modId, drillIdx, optionIdx) {
        const mod = CONTENT_BANK.skillModules.find((m) => m.id === modId);
        if (!mod) return;
        const drill = mod.drills[drillIdx];
        const fb = document.getElementById(`drill-fb-${modId}-${drillIdx}`);
        if (!drill || !fb) return;

        fb.classList.remove('hidden');
        if (optionIdx === drill.answer) {
          fb.className = 'mt-2 text-[11px] font-semibold text-emerald-700';
          fb.textContent = `Correct! ${drill.explain} (+10 XP)`;
          awardXp(10);
        } else {
          fb.className = 'mt-2 text-[11px] font-semibold text-rose-700';
          fb.textContent = `Not quite — Correct: ${drill.options[drill.answer]}. ${drill.explain}`;
        }
      },

      startExamById(examId) {
        startExamById(examId);
        renderCurrentPage();
      },

      cancelActiveExam() {
        activeExamSession = null;
        renderCurrentPage();
      },

      selectExamAnswer(qId, optIdx) {
        if (!activeExamSession) return;
        activeExamSession.answers[qId] = optIdx;
        renderCurrentPage();
      },

      submitActiveExam() {
        if (!activeExamSession) return;
        const ex = activeExamSession.exam;
        let correct = 0;
        ex.questions.forEach((q) => {
          const chosenIdx = activeExamSession.answers[q.id];
          if (chosenIdx === q.answer) {
            correct += 1;
          } else {
            appState.mistakes.unshift({
              id: 'm_' + Date.now() + '_' + q.id,
              date: todayISO(),
              source: ex.title,
              part: q.part,
              prompt: q.prompt,
              chosen: chosenIdx !== undefined ? q.options[chosenIdx] : '(No Answer)',
              correct: q.options[q.answer],
              explanation: q.explanation,
              mastered: false
            });
          }
        });

        const total = ex.questions.length;
        const scorePct = Math.round((correct / total) * 100);
        const estimatedToeic = Math.min(990, Math.max(250, Math.round((300 + scorePct * 6.6) / 5) * 5));

        appState.examResults.unshift({
          id: 'er_' + Date.now(),
          date: todayISO(),
          examId: ex.id,
          examTitle: ex.title,
          scorePct,
          correct,
          total,
          estimatedToeic
        });
        appState.profile.estimatedToeic = estimatedToeic;

        const scoreGoal = appState.goals.find((g) => g.id === 'g1');
        if (scoreGoal) {
          scoreGoal.current = Math.max(scoreGoal.current, estimatedToeic);
          if (scoreGoal.current >= scoreGoal.target) scoreGoal.completed = true;
        }

        activeExamSession = null;
        awardXp(40 + correct * 8, `Exam Graded: ${correct}/${total} (${scorePct}%) · Est. TOEIC ${estimatedToeic}`);
        renderCurrentPage();
      },

      toggleVocabFlip(cardId) {
        vocabFlippedId = vocabFlippedId === cardId ? null : cardId;
        renderCurrentPage();
      },

      rateVocabCard(cardId, rating) {
        const card = appState.vocabCards.find((c) => c.id === cardId);
        if (!card) return;
        if (rating === 'again') {
          card.box = 1;
          card.lapses += 1;
        } else if (rating === 'good') {
          card.box = Math.min(5, card.box + 1);
          awardXp(5);
        } else if (rating === 'easy') {
          card.box = Math.min(5, card.box + 2);
          awardXp(10);
        }
        vocabFlippedId = null;

        const vocabGoal = appState.goals.find((g) => g.id === 'g3');
        if (vocabGoal) {
          vocabGoal.current = appState.vocabCards.filter((c) => c.box >= 4).length;
          if (vocabGoal.current >= vocabGoal.target) vocabGoal.completed = true;
        }
        saveState();
        renderCurrentPage();
      },

      toggleMistakeMastered(mistakeId) {
        const item = appState.mistakes.find((m) => m.id === mistakeId);
        if (!item) return;
        item.mastered = !item.mastered;
        saveState();
        if (item.mastered) {
          awardXp(15, 'Mistake mastered');
        }
        renderCurrentPage();
      },

      boostGoalProgress(goalId) {
        const g = appState.goals.find((item) => item.id === goalId);
        if (!g) return;
        const step = Math.max(1, Math.round(g.target * 0.1));
        g.current = Math.min(g.target, g.current + step);
        if (g.current >= g.target) g.completed = true;
        awardXp(20, `Goal progress updated: ${g.title}`);
        renderCurrentPage();
      },

      updateSetting(key, val) {
        appState.settings[key] = val;
        if (key === 'pomodoroMinutes' && !StudySession.running && StudySession.elapsedSeconds === 0) {
          StudySession.targetSeconds = val * 60;
        }
        saveState();
        showToast('Settings saved.', 'info');
      },

      exportStateJson() {
        const ta = document.createElement('textarea');
        ta.value = JSON.stringify(appState, null, 2);
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        ta.remove();
        showToast('Full state backup JSON copied to clipboard!', 'success');
      },

      resetDemoData() {
        appState = createDefaultState();
        saveState();
        updateHeaderStatus();
        renderCurrentPage();
        showToast('Workspace reset to default state.', 'warn');
      },

      openOnboardingModal() {
        const modal = document.getElementById('onboarding-modal');
        const form = document.getElementById('onboarding-form');
        if (!modal || !form) return;
        const p = appState.profile;
        form.elements.name.value = p.name || '';
        form.elements.objectiveType.value = p.objectiveType || 'toeic';
        form.elements.targetToeic.value = p.targetToeic || 850;
        form.elements.estimatedToeic.value = p.estimatedToeic || '';
        form.elements.level.value = p.level || 'Intermediate';
        form.elements.targetDate.value = p.targetDate || addDaysISO(todayISO(), 60);
        form.elements.dailyMinutes.value = p.dailyMinutes || 45;
        form.elements.preferredSlot.value = p.preferredSlot || 'Evening (18:00–22:00)';
        form.elements.skillReading.value = p.skills.reading || 3;
        form.elements.skillListening.value = p.skills.listening || 3;
        form.elements.skillGrammar.value = p.skills.grammar || 3;
        form.elements.skillVocab.value = p.skills.vocab || 3;
        form.elements.weaknesses.value = p.weaknesses || '';
        form.elements.methods.value = p.methods || '';
        modal.classList.remove('hidden');
      },

      closeOnboardingModal() {
        const modal = document.getElementById('onboarding-modal');
        if (modal) modal.classList.add('hidden');
      }
    };

    global.TLH = TLH;

    // Onboarding Form Submit
    document.addEventListener('DOMContentLoaded', () => {
      const form = document.getElementById('onboarding-form');
      if (form) {
        form.addEventListener('submit', (e) => {
          e.preventDefault();
          const fd = new FormData(form);
          appState.profile = {
            name: String(fd.get('name') || 'Learner').trim(),
            objectiveType: String(fd.get('objectiveType') || 'toeic'),
            targetToeic: Number(fd.get('targetToeic')) || 850,
            estimatedToeic: Number(fd.get('estimatedToeic')) || appState.profile.estimatedToeic || 600,
            level: String(fd.get('level') || 'Intermediate'),
            targetDate: String(fd.get('targetDate') || addDaysISO(todayISO(), 60)),
            dailyMinutes: Number(fd.get('dailyMinutes')) || 45,
            preferredSlot: String(fd.get('preferredSlot') || 'Flexible'),
            skills: {
              reading: Number(fd.get('skillReading')) || 3,
              listening: Number(fd.get('skillListening')) || 3,
              grammar: Number(fd.get('skillGrammar')) || 3,
              vocab: Number(fd.get('skillVocab')) || 3
            },
            weaknesses: String(fd.get('weaknesses') || '').trim(),
            methods: String(fd.get('methods') || '').trim()
          };
          TLH.closeOnboardingModal();
          TLH.regeneratePlan();
          updateHeaderStatus();
        });
      }

      StudySession.targetSeconds = (appState.settings.pomodoroMinutes || 25) * 60;
      updateHeaderStatus();
      updateTimerUI();
      renderNavigation();
      renderCurrentPage();
    });
  })(window);
  </script>
</body>
</html>
