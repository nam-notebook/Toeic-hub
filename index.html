  <style>
    :root {
      --bg-ivory: #f8f5ee;
      --bg-card: #fffdf9;
      --bg-warm: #f1ece1;
      --ink-slate: #182026;
      --ink-muted: #5c6670;
      --border-soft: rgba(24, 32, 38, 0.11);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background-color: var(--bg-ivory);
      color: var(--ink-slate);
    }

    .font-display {
      font-family: 'Cinzel', Georgia, serif;
    }

    .tlh-card {
      background: var(--bg-card);
      border: 1px solid var(--border-soft);
      border-radius: 1rem;
      box-shadow: 0 4px 20px rgba(24, 32, 38, 0.04);
    }

    .tlh-card-warm {
      background: var(--bg-warm);
      border: 1px solid var(--border-soft);
      border-radius: 0.875rem;
    }

    .gw-stage-frame {
      position: relative;
      width: 100%;
      height: 100%;
      min-height: 360px;
      border-radius: 1rem;
      overflow: hidden;
      background: #142022;
      box-shadow:
        0 18px 40px rgba(15, 23, 28, 0.18),
        inset 0 0 0 1px rgba(255, 248, 226, 0.16);
      user-select: none;
    }

    .gw-thumb-frame {
      position: relative;
      width: 100%;
      height: 100%;
      min-height: 78px;
      border-radius: 0.75rem;
      overflow: hidden;
      background: #142022;
      box-shadow: inset 0 0 0 1px rgba(255, 248, 226, 0.14);
    }

    .gw-canvas {
      display: block;
      width: 100%;
      height: 100%;
      cursor: grab;
      touch-action: none;
    }

    .gw-canvas.is-hovering {
      cursor: pointer;
    }

    .gw-canvas:active {
      cursor: grabbing;
    }

    .glass-dark {
      background: rgba(18, 25, 28, 0.86);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 244, 214, 0.24);
      color: #f8f5ee;
    }

    .nav-pill.active {
      background: #3730a3;
      color: #ffffff;
      box-shadow: 0 4px 12px rgba(55, 48, 163, 0.25);
    }

    ::-webkit-scrollbar {
      width: 7px;
      height: 7px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(24, 32, 38, 0.18);
      border-radius: 999px;
    }

  <script>
  (function (global) {
    'use strict';

    function hashString(str) {
      let h = 2166136261 >>> 0;
      for (let i = 0; i < str.length; i++) {
        h ^= str.charCodeAt(i);
        h = Math.imul(h, 16777619);
      }
      return h >>> 0;
    }

    function createRng(seed) {
      let a = seed >>> 0;
      return function () {
        a |= 0;
        a = (a + 0x6D2B79F5) | 0;
        let t = Math.imul(a ^ (a >>> 15), 1 | a);
        t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
      };
    }

    function clamp(v, min, max) {
      return v < min ? min : v > max ? max : v;
    }

    function lerp(a, b, t) {
      return a + (b - a) * t;
    }

    function smoothstep(edge0, edge1, x) {
      const t = clamp((x - edge0) / (edge1 - edge0), 0, 1);
      return t * t * (3 - 2 * t);
    }

    function hexToRgb(hex) {
      const clean = hex.replace('#', '');
      const num = parseInt(clean, 16);
      return { r: (num >> 16) & 255, g: (num >> 8) & 255, b: num & 255 };
    }

    function rgbToCss(rgb, alpha = 1) {
      const r = Math.round(clamp(rgb.r, 0, 255));
      const g = Math.round(clamp(rgb.g, 0, 255));
      const b = Math.round(clamp(rgb.b, 0, 255));
      return alpha < 1 ? `rgba(${r},${g},${b},${alpha.toFixed(3)})` : `rgb(${r},${g},${b})`;
    }

    function shadeColor(hex, factor, tintHex = null, tintAmt = 0) {
      const c = hexToRgb(hex);
      let r = c.r * factor;
      let g = c.g * factor;
      let b = c.b * factor;
      if (tintHex && tintAmt > 0) {
        const t = hexToRgb(tintHex);
        r = lerp(r, t.r, tintAmt);
        g = lerp(g, t.g, tintAmt);
        b = lerp(b, t.b, tintAmt);
      }
      return rgbToCss({ r, g, b });
    }

    function mixHex(hexA, hexB, t) {
      const a = hexToRgb(hexA);
      const b = hexToRgb(hexB);
      return rgbToCss({
        r: lerp(a.r, b.r, t),
        g: lerp(a.g, b.g, t),
        b: lerp(a.b, b.b, t)
      });

    function resolveTheme(kind) {
      const canonical = THEME_ALIASES[kind] || (BASE_THEMES[kind] ? kind : 'tree');
      const base = BASE_THEMES[canonical];
      return {
        canonical,
        title: DISPLAY_TITLES[kind] || base.title,
        ...base
      };
    }

    const ISO_COS = 0.8660254;
    const ISO_SIN = 0.485;

    function isoProject(gx, gy, gz, originX, originY, tileW) {
      return {
        x: originX + (gx - gy) * ISO_COS * tileW,
        y: originY + (gx + gy) * ISO_SIN * tileW - gz * tileW * 0.94
      };
    }

    function drawIsoPrism(ctx, cx, cy, cz, w, d, h, topCol, leftCol, rightCol, originX, originY, tileW, strokeCol = null) {
      const hw = w * 0.5;
      const hd = d * 0.5;
      const p000 = isoProject(cx - hw, cy - hd, cz, originX, originY, tileW);
      const p100 = isoProject(cx + hw, cy - hd, cz, originX, originY, tileW);
      const p110 = isoProject(cx + hw, cy + hd, cz, originX, originY, tileW);
      const p010 = isoProject(cx - hw, cy + hd, cz, originX, originY, tileW);

      const p001 = isoProject(cx - hw, cy - hd, cz + h, originX, originY, tileW);
      const p101 = isoProject(cx + hw, cy - hd, cz + h, originX, originY, tileW);
      const p111 = isoProject(cx + hw, cy + hd, cz + h, originX, originY, tileW);
      const p011 = isoProject(cx - hw, cy + hd, cz + h, originX, originY, tileW);

      ctx.fillStyle = leftCol;
      ctx.beginPath();
      ctx.moveTo(p010.x, p010.y);
      ctx.lineTo(p110.x, p110.y);
      ctx.lineTo(p111.x, p111.y);
      ctx.lineTo(p011.x, p011.y);
      ctx.closePath();
      ctx.fill();
      if (strokeCol) { ctx.strokeStyle = strokeCol; ctx.lineWidth = 1; ctx.stroke(); }

      ctx.fillStyle = rightCol;
      ctx.beginPath();
      ctx.moveTo(p110.x, p110.y);
      ctx.lineTo(p100.x, p100.y);
      ctx.lineTo(p101.x, p101.y);
      ctx.lineTo(p111.x, p111.y);
      ctx.closePath();
      ctx.fill();
      if (strokeCol) { ctx.strokeStyle = strokeCol; ctx.lineWidth = 1; ctx.stroke(); }

      ctx.fillStyle = topCol;
      ctx.beginPath();
      ctx.moveTo(p001.x, p001.y);
      ctx.lineTo(p101.x, p101.y);
      ctx.lineTo(p111.x, p111.y);
      ctx.lineTo(p011.x, p011.y);
      ctx.closePath();
      ctx.fill();
      if (strokeCol) { ctx.strokeStyle = strokeCol; ctx.lineWidth = 1; ctx.stroke(); }

      return { p001, p101, p111, p011, p010, p110, p100 };
    }

    function renderSceneFrame(ctx, w, h, scene, timeSec, hoverId, levelUpState, isThumb, panOffset, zoomScale, lightingMode) {
      const { cfg, stage } = scene;
      const c = cfg.canonical;
      const mode = lightingMode || 'day';
      const isNight = mode === 'night';
      const isSunset = mode === 'sunset';

      ctx.save();

      // 1. Sky Gradient adapted for Day / Sunset / Night
      const skyGrad = ctx.createLinearGradient(0, 0, 0, h * 0.75);
      if (isNight) {
        skyGrad.addColorStop(0, '#050816');
        skyGrad.addColorStop(0.58, '#0f172a');
        skyGrad.addColorStop(1, '#1e293b');
      } else if (isSunset) {
        skyGrad.addColorStop(0, '#4c1d95');
        skyGrad.addColorStop(0.45, '#ea580c');
        skyGrad.addColorStop(1, '#fde047');
      } else {
        skyGrad.addColorStop(0, cfg.skyTop);
        skyGrad.addColorStop(0.62, mixHex(cfg.skyTop, cfg.skyHorizon, 0.64));
        skyGrad.addColorStop(1, cfg.skyHorizon);
      }
      ctx.fillStyle = skyGrad;
      ctx.fillRect(0, 0, w, h);

      if (c === 'space') {
        drawSpaceCosmicSky(ctx, w, h, timeSec, isThumb);
      } else if (c === 'sea') {
        drawDeepSeaBackdrop(ctx, w, h, timeSec, isThumb, isNight);
      } else if (c === 'aquarium') {
        drawAquariumRoomBackdrop(ctx, w, h, isNight);
      } else {
        if (isNight) {
          // Twinkling stars & crescent moon in Night mode
          for (let i = 0; i < 55; i++) {
            const sx = ((i * 173) % 1000) / 1000 * w;
            const sy = ((i * 89) % 1000) / 1000 * (h * 0.45);
            const tw = 0.35 + 0.65 * (0.5 + 0.5 * Math.sin(timeSec * 2.2 + i));
            ctx.fillStyle = `rgba(248, 250, 252, ${tw.toFixed(2)})`;
            ctx.beginPath();
            ctx.arc(sx, sy, i % 4 === 0 ? 1.5 : 0.9, 0, Math.PI * 2);
            ctx.fill();
          }
          const moonX = w * 0.80;
          const moonY = h * 0.14;
          const mGlow = ctx.createRadialGradient(moonX, moonY, 4, moonX, moonY, 55);
          mGlow.addColorStop(0, 'rgba(254, 249, 195, 0.7)');
          mGlow.addColorStop(1, 'rgba(254, 249, 195, 0)');
          ctx.fillStyle = mGlow;
          ctx.beginPath();
          ctx.arc(moonX, moonY, 55, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = '#fef9c3';
          ctx.beginPath();
          ctx.arc(moonX, moonY, 15, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = '#090e21';
          ctx.beginPath();
          ctx.arc(moonX + 6, moonY - 3, 13, 0, Math.PI * 2);
          ctx.fill();
        } else {
          const sunX = (c === 'beach' || isSunset) ? w * 0.24 : w * 0.18;
          const sunY = isSunset ? h * 0.34 : (c === 'beach' ? h * 0.24 : h * 0.15);
          const sunGrad = ctx.createRadialGradient(sunX, sunY, 5, sunX, sunY, Math.max(w, h) * 0.48);
          sunGrad.addColorStop(0, isSunset ? 'rgba(255, 251, 214, 0.95)' : 'rgba(255, 246, 214, 0.65)');
          sunGrad.addColorStop(0.32, isSunset ? 'rgba(251, 146, 60, 0.52)' : 'rgba(255, 224, 150, 0.25)');
          sunGrad.addColorStop(1, 'rgba(255, 224, 150, 0.0)');
          ctx.fillStyle = sunGrad;
          ctx.fillRect(0, 0, w, h);
        }

        if (!isThumb && !isNight) {
          scene.clouds.forEach((cl) => {
            const cx = (((cl.u + timeSec * cl.speed) % 1.25) - 0.12) * w;
            const cy = cl.v * h;
            drawCloud(ctx, cx, cy, cl.scale * (w / 900), isSunset ? cl.opacity * 0.7 : cl.opacity, isSunset ? '#fed7aa' : '#fffdf5');
          });
        }

        if (c !== 'beach') {
          const m1Col = isNight ? '#0f172a' : isSunset ? '#7c2d12' : mixHex(cfg.distantMountain, cfg.hazeColor, 0.35);
          const m2Col = isNight ? '#090d1a' : isSunset ? '#431407' : mixHex(cfg.midMountain, cfg.hazeColor, 0.18);
          drawMountainRange(ctx, w, h, 0.42, 0.115, 5, m1Col, 0.85);
          drawMountainRange(ctx, w, h, 0.475, 0.095, 7, m2Col, 0.94);
        }

        const horizonY = h * 0.49;
        const seaGrad = ctx.createLinearGradient(0, horizonY, 0, h);
        if (isNight) {
          seaGrad.addColorStop(0, '#0f172a');
          seaGrad.addColorStop(0.4, '#082f49');
          seaGrad.addColorStop(1, '#020617');
        } else if (isSunset) {
          seaGrad.addColorStop(0, '#fdba74');
          seaGrad.addColorStop(0.32, '#0284c7');
          seaGrad.addColorStop(1, '#0c4a6e');
        } else {
          seaGrad.addColorStop(0, mixHex(cfg.waterShallow, cfg.hazeColor, 0.32));
          seaGrad.addColorStop(0.32, cfg.waterShallow);
          seaGrad.addColorStop(1, cfg.waterDeep);
        }
        ctx.fillStyle = seaGrad;
        ctx.fillRect(0, horizonY, w, h - horizonY);

        if (!isThumb) {
          ctx.strokeStyle = isNight ? 'rgba(186, 230, 253, 0.14)' : 'rgba(255, 252, 236, 0.24)';
          ctx.lineWidth = 1.25;
          for (let r = 0; r < 14; r++) {
            const ry = horizonY + 12 + r * ((h - horizonY) / 14);
            const waveShift = Math.sin(timeSec * 1.1 + r * 1.35) * 18;
            const rx = ((r * 137) % (w * 0.8)) + w * 0.1 + waveShift;
            const rw = 22 + (r % 4) * 12;
            ctx.beginPath();
            ctx.moveTo(rx - rw, ry);
            ctx.lineTo(rx + rw, ry);
            ctx.stroke();
          }
        }
      }

      const zoom = isThumb ? 1 : clamp(Number(zoomScale) || 1, 0.5, 2.2);
      const baseTileW = isThumb
        ? Math.min(w * 0.155, h * 0.21)
        : Math.min(w * 0.148, h * 0.212) * (1 + stage * 0.022);
      const tileW = baseTileW * zoom;
      const originX = w * 0.5 + (panOffset ? panOffset.x : 0);
      const originY = h * (isThumb ? 0.625 : 0.64) + (panOffset ? panOffset.y : 0);

      if (c === 'aquarium') {
        drawAquariumTankBase(ctx, originX, originY, tileW, timeSec, false);
      } else {
        drawIsometricPlatformBase(ctx, originX, originY, tileW, cfg, stage, timeSec);
      }

      const renderables = [];
      scene.props.forEach((p) => renderables.push({ kind: 'prop', depth: p.depth, data: p }));
      scene.trees.forEach((t) => renderables.push({ kind: 'tree', depth: t.depth, data: t }));
      scene.buildings.forEach((b) => renderables.push({ kind: 'building', depth: b.depth, data: b }));
      scene.creatures.forEach((cr) => {
        const angle = timeSec * cr.speed + cr.phase;
        const gx = cr.gx0 + Math.cos(angle) * cr.rx;
        const gy = cr.gy0 + Math.sin(angle) * cr.ry;
        renderables.push({
          kind: 'creature',
          depth: gx + gy + (cr.gz || 0) * 0.08,
          data: { ...cr, gx, gy, angle }
        });
      });

      renderables.sort((a, b) => a.depth - b.depth);

      const hitBoxes = [];
      const nowMs = performance.now();
      const lvlElapsed = levelUpState ? (nowMs - levelUpState.startedAt) : 99999;
      const lvlActive = lvlElapsed < 2600;
      const lvlT = lvlActive ? (lvlElapsed / 2600) : 1;
      const pulseStrength = lvlActive ? Math.sin(lvlT * Math.PI) : 0;

      renderables.forEach((item) => {
        if (item.kind === 'prop') {
          drawCustomProp(ctx, item.data, originX, originY, tileW, cfg, timeSec, isNight);
        } else if (item.kind === 'tree') {
          drawCustomFlora(ctx, item.data, originX, originY, tileW, cfg, timeSec);
        } else if (item.kind === 'creature') {
          drawCustomCreature(ctx, item.data, originX, originY, tileW, cfg, timeSec);
        } else if (item.kind === 'building') {
          const isHovered = hoverId === item.data.id;
          const hb = drawCustomLandmark(ctx, item.data, originX, originY, tileW, cfg, timeSec, isHovered, pulseStrength, isNight);
          if (hb) hitBoxes.push(hb);
        }
      });

      if (c === 'aquarium') {
        drawAquariumTankBase(ctx, originX, originY, tileW, timeSec, true);
      }

      // Ambient fireflies / bubbles / light motes
      if (!isThumb) {
        scene.particles.forEach((pt) => {
          const driftX = Math.sin(timeSec * pt.speed + pt.phase) * 0.45;
          const driftY = Math.cos(timeSec * pt.speed * 0.8 + pt.phase) * 0.45;
          const driftZ = pt.gz + Math.sin(timeSec * pt.speed * 1.2 + pt.phase) * 0.25;
          const pos = isoProject(pt.gx + driftX, pt.gy + driftY, driftZ, originX, originY, tileW);
          const alpha = (isNight ? 0.55 : 0.35) + 0.45 * (0.5 + 0.5 * Math.sin(timeSec * 2.4 + pt.phase));
          ctx.beginPath();
          ctx.fillStyle = (c === 'aquarium' || c === 'sea')
            ? `rgba(224, 242, 254, ${alpha.toFixed(2)})`
            : rgbToCss(hexToRgb(isNight ? '#fde047' : cfg.accentGlow), alpha);
          ctx.arc(pos.x, pos.y, pt.radius * (isNight ? 1.25 : 1), 0, Math.PI * 2);
          ctx.fill();
        });

        scene.birds.forEach((bd) => {
          const ang = timeSec * bd.speed + bd.phase;
          const bx = (bd.cx + Math.cos(ang) * bd.rx) * w;
          const by = (bd.cy + Math.sin(ang) * bd.ry) * h;
          const wing = Math.sin(timeSec * 8.5 + bd.phase) * bd.size * 0.65;
          ctx.strokeStyle = isNight ? 'rgba(226, 232, 240, 0.55)' : 'rgba(28, 38, 46, 0.65)';
          ctx.lineWidth = 1.4;
          ctx.beginPath();
          ctx.moveTo(bx - bd.size, by + wing);
          ctx.quadraticCurveTo(bx - bd.size * 0.4, by - bd.size * 0.45, bx, by);
          ctx.quadraticCurveTo(bx + bd.size * 0.4, by - bd.size * 0.45, bx + bd.size, by + wing);
          ctx.stroke();
        });
      }

      // Level-Up Celebration Shockwave & Starburst Confetti
      if (!isThumb && lvlActive) {
        const ringAlpha = (1 - lvlT) * 0.88;
        const maxR = Math.max(w, h) * 0.46;
        for (let rIdx = 0; rIdx < 2; rIdx++) {
          const progress = clamp((lvlT - rIdx * 0.14) / 0.86, 0, 1);
          if (progress > 0) {
            ctx.strokeStyle = rIdx === 0
              ? `rgba(253, 224, 71, ${ringAlpha.toFixed(2)})`
              : `rgba(56, 189, 248, ${(ringAlpha * 0.75).toFixed(2)})`;
            ctx.lineWidth = (1 - progress) * 7 + 1.5;
            ctx.beginPath();
            ctx.ellipse(originX, originY - tileW * 0.4, progress * maxR, progress * maxR * 0.56, 0, 0, Math.PI * 2);
            ctx.stroke();
          }
        }

        const burstCols = ['#fde047', '#38bdf8', '#f472b6', '#4ade80', '#fb923c', '#ffffff'];
        for (let p = 0; p < 34; p++) {
          const ang = (p / 34) * Math.PI * 2 + p * 0.21;
          const dist = lvlT * (120 + (p % 5) * 44);
          const px = originX + Math.cos(ang) * dist;
          const py = (originY - tileW * 0.8) + Math.sin(ang) * dist * 0.62 - Math.sin(lvlT * Math.PI) * 52;
          ctx.fillStyle = burstCols[p % burstCols.length];
          ctx.globalAlpha = 1 - lvlT;
          ctx.beginPath();
          ctx.arc(px, py, 3.2 - lvlT * 1.5, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.globalAlpha = 1;

        // Floating Stage-Up Banner
        const bannerAlpha = lvlT < 0.15 ? (lvlT / 0.15) : lvlT > 0.75 ? ((1 - lvlT) / 0.25) : 1;
        const bannerY = h * 0.22 - lvlT * 24;
        ctx.save();
        ctx.globalAlpha = clamp(bannerAlpha, 0, 1);
        ctx.fillStyle = 'rgba(15, 23, 42, 0.84)';
        ctx.strokeStyle = '#fde047';
        ctx.lineWidth = 2;
        const bw = 240;
        const bh = 42;
        ctx.beginPath();
        ctx.roundRect(w * 0.5 - bw * 0.5, bannerY - bh * 0.5, bw, bh, 12);
        ctx.fill();
        ctx.stroke();

        ctx.fillStyle = '#fde047';
        ctx.font = '700 13px Cinzel, Georgia, serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(levelUpState.label || `STAGE ${stage} UNLOCKED!`, w * 0.5, bannerY);
        ctx.restore();
      }

      // Atmosphere Tint Overlay for Sunset / Night
      if (isNight) {
        ctx.fillStyle = 'rgba(8, 15, 38, 0.26)';
        ctx.fillRect(0, 0, w, h);
      } else if (isSunset) {
        ctx.fillStyle = 'rgba(249, 115, 22, 0.10)';
        ctx.fillRect(0, 0, w, h);
      }

      const vig = ctx.createRadialGradient(w * 0.5, h * 0.5, Math.min(w, h) * 0.34, w * 0.5, h * 0.5, Math.max(w, h) * 0.74);
      vig.addColorStop(0, 'rgba(0,0,0,0)');
      vig.addColorStop(1, isNight ? 'rgba(2, 6, 23, 0.42)' : 'rgba(10, 16, 20, 0.24)');
      ctx.fillStyle = vig;
      ctx.fillRect(0, 0, w, h);

      ctx.restore();
      return hitBoxes;
    }

    function drawDeepSeaBackdrop(ctx, w, h, timeSec, isThumb, isNight) {
      const surfGrad = ctx.createLinearGradient(0, 0, 0, h * 0.24);
      surfGrad.addColorStop(0, isNight ? 'rgba(56, 189, 248, 0.35)' : 'rgba(186, 230, 253, 0.78)');
      surfGrad.addColorStop(0.5, 'rgba(56, 189, 248, 0.28)');
      surfGrad.addColorStop(1, 'rgba(14, 116, 144, 0)');
      ctx.fillStyle = surfGrad;
      ctx.fillRect(0, 0, w, h * 0.24);

      for (let i = 0; i < 6; i++) {
        const bx = w * (0.12 + i * 0.15) + Math.sin(timeSec * 0.7 + i) * 16;
        const rayGrad = ctx.createLinearGradient(bx, 0, bx + 45, h * 0.78);
        rayGrad.addColorStop(0, isNight ? 'rgba(125, 211, 252, 0.12)' : 'rgba(186, 230, 253, 0.22)');
        rayGrad.addColorStop(1, 'rgba(186, 230, 253, 0)');
        ctx.fillStyle = rayGrad;
        ctx.beginPath();
        ctx.moveTo(bx - 18, 0);
        ctx.lineTo(bx + 18, 0);
        ctx.lineTo(bx + 78, h * 0.78);
        ctx.lineTo(bx + 12, h * 0.78);
        ctx.closePath();
        ctx.fill();
      }

      drawMountainRange(ctx, w, h, 0.45, 0.11, 6, 'rgba(8, 51, 78, 0.72)', 0.85);
      drawMountainRange(ctx, w, h, 0.51, 0.08, 8, 'rgba(6, 38, 60, 0.88)', 0.95);
    }

    function drawSpaceCosmicSky(ctx, w, h, timeSec, isThumb) {
      const neb1 = ctx.createRadialGradient(w * 0.72, h * 0.22, 10, w * 0.72, h * 0.22, w * 0.38);
      neb1.addColorStop(0, 'rgba(139, 92, 246, 0.38)');
      neb1.addColorStop(0.5, 'rgba(56, 189, 248, 0.16)');
      neb1.addColorStop(1, 'rgba(15, 23, 42, 0)');
      ctx.fillStyle = neb1;
      ctx.fillRect(0, 0, w, h);

      for (let i = 0; i < 65; i++) {
        const sx = ((i * 193) % 1000) / 1000 * w;
        const sy = ((i * 97) % 1000) / 1000 * (h * 0.68);
        const twinkle = 0.35 + 0.65 * (0.5 + 0.5 * Math.sin(timeSec * 2.5 + i));
        ctx.fillStyle = `rgba(248, 250, 252, ${twinkle.toFixed(2)})`;
        ctx.beginPath();
        ctx.arc(sx, sy, (i % 3 === 0 ? 1.5 : 0.9), 0, Math.PI * 2);
        ctx.fill();
      }

      const sunX = w * 0.13;
      const sunY = h * 0.16;
      const sunR = Math.min(w, h) * 0.088;
      const corona = ctx.createRadialGradient(sunX, sunY, sunR * 0.3, sunX, sunY, sunR * 3.3);
      corona.addColorStop(0, 'rgba(255, 251, 214, 0.96)');
      corona.addColorStop(0.35, 'rgba(251, 191, 36, 0.45)');
      corona.addColorStop(1, 'rgba(251, 146, 60, 0)');
      ctx.fillStyle = corona;
      ctx.beginPath();
      ctx.arc(sunX, sunY, sunR * 3.3, 0, Math.PI * 2);
      ctx.fill();

      const satX = w * 0.81;
      const satY = h * 0.19;
      const satR = Math.min(w, h) * 0.062;
      ctx.save();
      ctx.translate(satX, satY);
      ctx.rotate(-0.34);
      ctx.strokeStyle = 'rgba(253, 230, 138, 0.58)';
      ctx.lineWidth = satR * 0.25;
      ctx.beginPath();
      ctx.ellipse(0, 0, satR * 2.4, satR * 0.6, 0, 0, Math.PI * 2);
      ctx.stroke();
      ctx.strokeStyle = 'rgba(245, 158, 11, 0.48)';
      ctx.lineWidth = satR * 0.1;
      ctx.beginPath();
      ctx.ellipse(0, 0, satR * 1.95, satR * 0.46, 0, 0, Math.PI * 2);
      ctx.stroke();
      const satGrad = ctx.createRadialGradient(-satR * 0.3, -satR * 0.3, 2, 0, 0, satR);
      satGrad.addColorStop(0, '#fef3c7');
      satGrad.addColorStop(0.6, '#f59e0b');
      satGrad.addColorStop(1, '#78350f');
      ctx.fillStyle = satGrad;
      ctx.beginPath();
      ctx.arc(0, 0, satR, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();

      const moonX = w * 0.36;
      const moonY = h * 0.12;
      ctx.fillStyle = '#e0f2fe';
      ctx.beginPath();
      ctx.arc(moonX, moonY, 13, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#121b38';
      ctx.beginPath();
      ctx.arc(moonX + 5.5, moonY - 3, 11, 0, Math.PI * 2);
      ctx.fill();

      if (!isThumb) {
        const cometProgress = (timeSec * 0.14) % 1;
        const cx = lerp(w * 0.66, w * 0.22, cometProgress);
        const cy = lerp(h * 0.06, h * 0.28, cometProgress);
        const tail = ctx.createLinearGradient(cx, cy, cx + 68, cy - 34);
        tail.addColorStop(0, 'rgba(186, 230, 253, 0.92)');
        tail.addColorStop(1, 'rgba(186, 230, 253, 0)');
        ctx.strokeStyle = tail;
        ctx.lineWidth = 2.8;
        ctx.beginPath();
        ctx.moveTo(cx, cy);
        ctx.lineTo(cx + 68, cy - 34);
        ctx.stroke();
      }
    }

    function drawAquariumRoomBackdrop(ctx, w, h, isNight) {
      const bg = ctx.createRadialGradient(w * 0.5, h * 0.42, 20, w * 0.5, h * 0.5, Math.max(w, h) * 0.72);
      bg.addColorStop(0, isNight ? '#0e3a4d' : '#164e63');
      bg.addColorStop(0.6, isNight ? '#081b29' : '#0f293a');
      bg.addColorStop(1, '#050e17');
      ctx.fillStyle = bg;
      ctx.fillRect(0, 0, w, h);
    }

    function drawCloud(ctx, cx, cy, scale, opacity, tint = '#fffdf5') {
      ctx.save();
      ctx.translate(cx, cy);
      ctx.scale(scale, scale);
      ctx.fillStyle = rgbToCss(hexToRgb(tint), opacity);
      ctx.beginPath();
      ctx.arc(-26, 6, 18, 0, Math.PI * 2);
      ctx.arc(-6, -4, 24, 0, Math.PI * 2);
      ctx.arc(18, 0, 20, 0, Math.PI * 2);
      ctx.arc(36, 8, 14, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    function drawMountainRange(ctx, w, h, baseRatio, ampRatio, peaks, color, alpha) {
      ctx.save();
      ctx.globalAlpha = alpha;
      ctx.fillStyle = color;
      ctx.beginPath();
      ctx.moveTo(0, h * 0.58);
      const step = w / peaks;
      for (let i = 0; i <= peaks; i++) {
        const px = i * step;
        const peakH = (0.55 + 0.45 * Math.sin(i * 2.1 + 0.7)) * h * ampRatio;
        const py = h * baseRatio - peakH;
        if (i === 0) ctx.lineTo(px, py + peakH * 0.4);
        else {
          const prevX = (i - 1) * step;
          ctx.quadraticCurveTo(prevX + step * 0.5, py, px, py + peakH * 0.45);
        }
      }
      ctx.lineTo(w, h * 0.58);
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    }

    function drawIsometricPlatformBase(ctx, originX, originY, tileW, cfg, stage, timeSec) {
      const c = cfg.canonical;
      const half = 3.6;
      const thick = 0.72;

      const pN = isoProject(-half, -half, 0, originX, originY, tileW);
      const pE = isoProject(half, -half, 0, originX, originY, tileW);
      const pS = isoProject(half, half, 0, originX, originY, tileW);
      const pW = isoProject(-half, half, 0, originX, originY, tileW);

      const pEB = isoProject(half, -half, -thick, originX, originY, tileW);
      const pSB = isoProject(half, half, -thick, originX, originY, tileW);
      const pWB = isoProject(-half, half, -thick, originX, originY, tileW);

      ctx.save();
      ctx.fillStyle = 'rgba(8, 18, 24, 0.34)';
      ctx.beginPath();
      ctx.ellipse(originX, originY + tileW * 2.15, tileW * 3.7, tileW * 1.45, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();

      if (c === 'island' || c === 'beach' || c === 'market') {
        for (let ring = 0; ring < 2; ring++) {
          const pulse = Math.sin(timeSec * 1.6 + ring * 2.1) * 4 + ring * 14;
          ctx.strokeStyle = ring === 0 ? 'rgba(255, 255, 255, 0.48)' : 'rgba(186, 230, 253, 0.28)';
          ctx.lineWidth = ring === 0 ? 2.6 : 1.6;
          ctx.beginPath();
          ctx.ellipse(originX, originY + tileW * 0.14, tileW * 4.55 + pulse, tileW * 2.52 + pulse * 0.52, 0, 0, Math.PI * 2);
          ctx.stroke();
        }
      }

      const leftGrad = ctx.createLinearGradient(pW.x, pW.y, pSB.x, pSB.y);
      leftGrad.addColorStop(0, shadeColor(cfg.earthLeft, 1.12));
      leftGrad.addColorStop(0.55, cfg.earthLeft);
      leftGrad.addColorStop(1, shadeColor(cfg.earthLeft, 0.72));
      ctx.fillStyle = leftGrad;
      ctx.beginPath();
      ctx.moveTo(pW.x, pW.y); ctx.lineTo(pS.x, pS.y);
      ctx.lineTo(pSB.x, pSB.y); ctx.lineTo(pWB.x, pWB.y);
      ctx.closePath();
      ctx.fill();

      const rightGrad = ctx.createLinearGradient(pS.x, pS.y, pEB.x, pEB.y);
      rightGrad.addColorStop(0, cfg.earthRight);
      rightGrad.addColorStop(1, shadeColor(cfg.earthRight, 0.68));
      ctx.fillStyle = rightGrad;
      ctx.beginPath();
      ctx.moveTo(pS.x, pS.y); ctx.lineTo(pE.x, pE.y);
      ctx.lineTo(pEB.x, pEB.y); ctx.lineTo(pSB.x, pSB.y);
      ctx.closePath();
      ctx.fill();

      const topGrad = ctx.createLinearGradient(pN.x, pN.y, pS.x, pS.y);
      topGrad.addColorStop(0, cfg.grassHi);
      topGrad.addColorStop(0.52, cfg.grassTop);
      topGrad.addColorStop(1, shadeColor(cfg.grassTop, 0.85));
      ctx.fillStyle = topGrad;
      ctx.beginPath();
      ctx.moveTo(pN.x, pN.y); ctx.lineTo(pE.x, pE.y);
      ctx.lineTo(pS.x, pS.y); ctx.lineTo(pW.x, pW.y);
      ctx.closePath();
      ctx.fill();

      ctx.strokeStyle = 'rgba(255, 252, 235, 0.48)';
      ctx.lineWidth = 1.8;
      ctx.stroke();

      if (c === 'beach') {
        const w1 = isoProject(-3.6, 1.85, 0.01, originX, originY, tileW);
        const w2 = isoProject(3.6, 1.85, 0.01, originX, originY, tileW);
        const w3 = isoProject(3.6, 3.6, 0.01, originX, originY, tileW);
        const w4 = isoProject(-3.6, 3.6, 0.01, originX, originY, tileW);
        const shoreGrad = ctx.createLinearGradient(w1.x, w1.y, w3.x, w3.y);
        shoreGrad.addColorStop(0, 'rgba(103, 232, 249, 0.45)');
        shoreGrad.addColorStop(0.45, '#22d3ee');
        shoreGrad.addColorStop(1, '#0284c7');
        ctx.fillStyle = shoreGrad;
        ctx.beginPath();
        ctx.moveTo(w1.x, w1.y); ctx.lineTo(w2.x, w2.y);
        ctx.lineTo(w3.x, w3.y); ctx.lineTo(w4.x, w4.y);
        ctx.closePath();
        ctx.fill();

        const tide = Math.sin(timeSec * 1.8) * 0.14;
        const fL = isoProject(-3.5, 1.92 + tide, 0.02, originX, originY, tileW);
        const fR = isoProject(3.5, 1.92 + tide, 0.02, originX, originY, tileW);
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.85)';
        ctx.lineWidth = 2.6;
        ctx.beginPath();
        ctx.moveTo(fL.x, fL.y);
        ctx.lineTo(fR.x, fR.y);
        ctx.stroke();

        const b1 = isoProject(-3.2, -0.75, 0.015, originX, originY, tileW);
        const b2 = isoProject(3.2, -0.75, 0.015, originX, originY, tileW);
        const b3 = isoProject(3.2, -0.15, 0.015, originX, originY, tileW);
        const b4 = isoProject(-3.2, -0.15, 0.015, originX, originY, tileW);
        ctx.fillStyle = '#b45309';
        ctx.beginPath();
        ctx.moveTo(b1.x, b1.y); ctx.lineTo(b2.x, b2.y);
        ctx.lineTo(b3.x, b3.y); ctx.lineTo(b4.x, b4.y);
        ctx.closePath();
        ctx.fill();
      } else if (c === 'sea') {
        ctx.strokeStyle = 'rgba(180, 140, 80, 0.24)';
        ctx.lineWidth = 1.4;
        for (let r = -2.2; r <= 2.2; r += 0.85) {
          const a = isoProject(-2.8, r, 0.01, originX, originY, tileW);
          const b = isoProject(2.8, r, 0.01, originX, originY, tileW);
          ctx.beginPath();
          ctx.moveTo(a.x, a.y);
          ctx.quadraticCurveTo((a.x + b.x) * 0.5, (a.y + b.y) * 0.5 + 5, b.x, b.y);
          ctx.stroke();
        }
      } else if (c !== 'space' && c !== 'city') {
        ctx.fillStyle = 'rgba(255, 255, 255, 0.14)';
        for (let gx = -2.6; gx <= 2.6; gx += 1.3) {
          for (let gy = -2.6; gy <= 2.6; gy += 1.3) {
            const tp = isoProject(gx + Math.sin(gy * 3) * 0.2, gy + Math.cos(gx * 3) * 0.2, 0.01, originX, originY, tileW);
            ctx.beginPath();
            ctx.ellipse(tp.x, tp.y, tileW * 0.14, tileW * 0.07, 0, 0, Math.PI * 2);
            ctx.fill();
          }
        }
      }

      if (c === 'island') {
        const hN = isoProject(-2.55, -2.55, 0.02, originX, originY, tileW);
        const hE = isoProject(2.55, -2.55, 0.02, originX, originY, tileW);
        const hS = isoProject(2.55, 2.55, 0.02, originX, originY, tileW);
        const hW = isoProject(-2.55, 2.55, 0.02, originX, originY, tileW);
        const lushGrad = ctx.createLinearGradient(hN.x, hN.y, hS.x, hS.y);
        lushGrad.addColorStop(0, '#74d44c');
        lushGrad.addColorStop(1, '#489e32');
        ctx.fillStyle = lushGrad;
        ctx.beginPath();
        ctx.moveTo(hN.x, hN.y); ctx.lineTo(hE.x, hE.y);
        ctx.lineTo(hS.x, hS.y); ctx.lineTo(hW.x, hW.y);
        ctx.closePath();
        ctx.fill();
      } else if (c === 'market') {
        const c1 = isoProject(-3.6, -0.45, 0.01, originX, originY, tileW);
        const c2 = isoProject(3.6, -0.45, 0.01, originX, originY, tileW);
        const c3 = isoProject(3.6, 1.25, 0.01, originX, originY, tileW);
        const c4 = isoProject(-3.6, 1.25, 0.01, originX, originY, tileW);
        const cGrad = ctx.createLinearGradient(c1.x, c1.y, c3.x, c3.y);
        cGrad.addColorStop(0, '#0f766e');
        cGrad.addColorStop(0.5, '#2dd4bf');
        cGrad.addColorStop(1, '#115e59');
        ctx.fillStyle = cGrad;
        ctx.beginPath();
        ctx.moveTo(c1.x, c1.y); ctx.lineTo(c2.x, c2.y);
        ctx.lineTo(c3.x, c3.y); ctx.lineTo(c4.x, c4.y);
        ctx.closePath();
        ctx.fill();

        ctx.strokeStyle = 'rgba(255, 255, 255, 0.34)';
        ctx.lineWidth = 1.3;
        for (let wIdx = -2; wIdx <= 2; wIdx++) {
          const shift = ((timeSec * 0.65 + wIdx * 0.4) % 1) * 5.6 - 2.8;
          const ws = isoProject(shift - 0.35, 0.4 + (wIdx % 2) * 0.25, 0.02, originX, originY, tileW);
          const we = isoProject(shift + 0.35, 0.4 + (wIdx % 2) * 0.25, 0.02, originX, originY, tileW);
          ctx.beginPath();
          ctx.moveTo(ws.x, ws.y);
          ctx.lineTo(we.x, we.y);
          ctx.stroke();
        }
      } else if (c === 'tree') {
        const s1 = isoProject(-1.85, -3.6, 0.01, originX, originY, tileW);
        const s2 = isoProject(0.4, 0.2, 0.01, originX, originY, tileW);
        const s3 = isoProject(1.45, 3.6, 0.01, originX, originY, tileW);
        ctx.strokeStyle = '#0d9488';
        ctx.lineWidth = tileW * 0.56;
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(s1.x, s1.y);
        ctx.quadraticCurveTo(s2.x, s2.y, s3.x, s3.y);
        ctx.stroke();

        ctx.strokeStyle = '#5eead4';
        ctx.lineWidth = tileW * 0.32;
        ctx.beginPath();
        ctx.moveTo(s1.x, s1.y);
        ctx.quadraticCurveTo(s2.x, s2.y, s3.x, s3.y);
        ctx.stroke();
      } else if (c === 'city') {
        ctx.fillStyle = '#334155';
        const rA1 = isoProject(-3.6, 1.35, 0.01, originX, originY, tileW);
        const rA2 = isoProject(3.6, 1.35, 0.01, originX, originY, tileW);
        const rA3 = isoProject(3.6, 2.25, 0.01, originX, originY, tileW);
        const rA4 = isoProject(-3.6, 2.25, 0.01, originX, originY, tileW);
        ctx.beginPath();
        ctx.moveTo(rA1.x, rA1.y); ctx.lineTo(rA2.x, rA2.y);
        ctx.lineTo(rA3.x, rA3.y); ctx.lineTo(rA4.x, rA4.y);
        ctx.closePath();
        ctx.fill();

        const rB1 = isoProject(1.35, -3.6, 0.01, originX, originY, tileW);
        const rB2 = isoProject(2.25, -3.6, 0.01, originX, originY, tileW);
        const rB3 = isoProject(2.25, 3.6, 0.01, originX, originY, tileW);
        const rB4 = isoProject(1.35, 3.6, 0.01, originX, originY, tileW);
        ctx.beginPath();
        ctx.moveTo(rB1.x, rB1.y); ctx.lineTo(rB2.x, rB2.y);
        ctx.lineTo(rB3.x, rB3.y); ctx.lineTo(rB4.x, rB4.y);
        ctx.closePath();
        ctx.fill();

        ctx.strokeStyle = '#f8fafc';
        ctx.setLineDash([6, 6]);
        ctx.lineWidth = 1.5;
        const m1 = isoProject(-3.45, 1.8, 0.02, originX, originY, tileW);
        const m2 = isoProject(3.45, 1.8, 0.02, originX, originY, tileW);
        ctx.beginPath(); ctx.moveTo(m1.x, m1.y); ctx.lineTo(m2.x, m2.y); ctx.stroke();
        const m3 = isoProject(1.8, -3.45, 0.02, originX, originY, tileW);
        const m4 = isoProject(1.8, 3.45, 0.02, originX, originY, tileW);
        ctx.beginPath(); ctx.moveTo(m3.x, m3.y); ctx.lineTo(m4.x, m4.y); ctx.stroke();
        ctx.setLineDash([]);
      } else if (c === 'bamboo' && stage >= 1) {
        for (let i = -2; i <= 2; i++) {
          const st = isoProject(i * 0.58 - 0.3, 2.28 - Math.abs(i) * 0.15, 0.02, originX, originY, tileW);
          ctx.fillStyle = '#cbd5e1';
          ctx.beginPath();
          ctx.ellipse(st.x + 1.5, st.y + 1.5, tileW * 0.2, tileW * 0.11, 0, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = '#f1f5f9';
          ctx.beginPath();
          ctx.ellipse(st.x, st.y, tileW * 0.19, tileW * 0.1, 0, 0, Math.PI * 2);
          ctx.fill();
        }
      }
    }

    function drawAquariumTankBase(ctx, originX, originY, tileW, timeSec, frontPass) {
      const half = 3.25;
      const tankH = 2.75;
      const pN = isoProject(-half, -half, 0, originX, originY, tileW);
      const pE = isoProject(half, -half, 0, originX, originY, tileW);
      const pS = isoProject(half, half, 0, originX, originY, tileW);
      const pW = isoProject(-half, half, 0, originX, originY, tileW);

      const pNT = isoProject(-half, -half, tankH, originX, originY, tileW);
      const pET = isoProject(half, -half, tankH, originX, originY, tileW);
      const pST = isoProject(half, half, tankH, originX, originY, tileW);
      const pWT = isoProject(-half, half, tankH, originX, originY, tileW);

      if (!frontPass) {
        ctx.fillStyle = 'rgba(14, 116, 144, 0.48)';
        ctx.beginPath();
        ctx.moveTo(pW.x, pW.y); ctx.lineTo(pN.x, pN.y);
        ctx.lineTo(pNT.x, pNT.y); ctx.lineTo(pWT.x, pWT.y);
        ctx.closePath();
        ctx.fill();

        ctx.fillStyle = 'rgba(8, 145, 178, 0.40)';
        ctx.beginPath();
        ctx.moveTo(pN.x, pN.y); ctx.lineTo(pE.x, pE.y);
        ctx.lineTo(pET.x, pET.y); ctx.lineTo(pNT.x, pNT.y);
        ctx.closePath();
        ctx.fill();

        const sandGrad = ctx.createLinearGradient(pN.x, pN.y, pS.x, pS.y);
        sandGrad.addColorStop(0, '#fef3c7');
        sandGrad.addColorStop(0.55, '#f3d89c');
        sandGrad.addColorStop(1, '#d8b473');
        ctx.fillStyle = sandGrad;
        ctx.beginPath();
        ctx.moveTo(pN.x, pN.y); ctx.lineTo(pE.x, pE.y);
        ctx.lineTo(pS.x, pS.y); ctx.lineTo(pW.x, pW.y);
        ctx.closePath();
        ctx.fill();

        for (let ray = -1; ray <= 1; ray++) {
          const sway = Math.sin(timeSec * 1.4 + ray * 1.7) * 16;
          const topPt = isoProject(ray * 1.1, -0.8, tankH * 0.92, originX, originY, tileW);
          const botPt = isoProject(ray * 1.1 + 0.4, 0.6, 0.02, originX, originY, tileW);
          const rayGrad = ctx.createLinearGradient(topPt.x, topPt.y, botPt.x, botPt.y);
          rayGrad.addColorStop(0, 'rgba(186, 230, 253, 0.28)');
          rayGrad.addColorStop(1, 'rgba(186, 230, 253, 0.0)');
          ctx.fillStyle = rayGrad;
          ctx.beginPath();
          ctx.moveTo(topPt.x - 16, topPt.y);
          ctx.lineTo(topPt.x + 16, topPt.y);
          ctx.lineTo(botPt.x + 34 + sway, botPt.y);
          ctx.lineTo(botPt.x - 34 + sway, botPt.y);
          ctx.closePath();
          ctx.fill();
        }
      } else {
        ctx.fillStyle = 'rgba(125, 211, 252, 0.16)';
        ctx.beginPath();
        ctx.moveTo(pNT.x, pNT.y); ctx.lineTo(pET.x, pET.y);
        ctx.lineTo(pST.x, pST.y); ctx.lineTo(pWT.x, pWT.y);
        ctx.closePath();
        ctx.fill();

        ctx.fillStyle = 'rgba(56, 189, 248, 0.12)';
        ctx.beginPath();
        ctx.moveTo(pW.x, pW.y); ctx.lineTo(pS.x, pS.y);
        ctx.lineTo(pST.x, pST.y); ctx.lineTo(pWT.x, pWT.y);
        ctx.closePath();
        ctx.fill();

        ctx.beginPath();
        ctx.moveTo(pS.x, pS.y); ctx.lineTo(pE.x, pE.y);
        ctx.lineTo(pET.x, pET.y); ctx.lineTo(pST.x, pST.y);
        ctx.closePath();
        ctx.fill();

        ctx.strokeStyle = 'rgba(224, 242, 254, 0.84)';
        ctx.lineWidth = 2.6;
        ctx.beginPath();
        ctx.moveTo(pWT.x, pWT.y); ctx.lineTo(pST.x, pST.y); ctx.lineTo(pET.x, pET.y);
        ctx.moveTo(pST.x, pST.y); ctx.lineTo(pS.x, pS.y);
        ctx.moveTo(pW.x, pW.y); ctx.lineTo(pS.x, pS.y); ctx.lineTo(pE.x, pE.y);
        ctx.stroke();
      }
    }

    function drawCustomFlora(ctx, t, originX, originY, tileW, cfg, timeSec) {
      ctx.save();
      const base = isoProject(t.gx, t.gy, t.gz, originX, originY, tileW);
      const s = t.scale * (tileW / 40);
      const sway = Math.sin(timeSec * 1.55 + t.phase) * 2.1 * s;

      ctx.fillStyle = 'rgba(18, 30, 22, 0.22)';
      ctx.beginPath();
      ctx.ellipse(base.x + 5 * s, base.y + 2.5 * s, 14 * s, 6.5 * s, 0.18, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = 'rgba(12, 22, 16, 0.28)';
      ctx.beginPath();
      ctx.ellipse(base.x, base.y + 1 * s, 6.5 * s, 3.2 * s, 0, 0, Math.PI * 2);
      ctx.fill();

      function drawFoliagePuff(cx, cy, rx, ry, deepCol, midCol, lightCol) {
        ctx.fillStyle = deepCol;
        ctx.beginPath();
        ctx.ellipse(cx, cy + ry * 0.14, rx, ry, 0, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = midCol;
        ctx.beginPath();
        ctx.ellipse(cx - rx * 0.06, cy - ry * 0.06, rx * 0.9, ry * 0.86, 0, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = lightCol;
        ctx.beginPath();
        ctx.ellipse(cx - rx * 0.24, cy - ry * 0.28, rx * 0.56, ry * 0.48, -0.2, 0, Math.PI * 2);
        ctx.fill();
      }

      if (t.variant === 'bamboo') {
        const stalks = [
          { ox: -6.5, h: 40, thick: 2.9, col: '#4d7c0f', hi: '#84cc16' },
          { ox: 0.5, h: 48, thick: 3.3, col: '#3f6212', hi: '#65a30d' },
          { ox: 7.0, h: 37, thick: 2.8, col: '#5c8a14', hi: '#a3e635' }
        ];
        stalks.forEach((st, idx) => {
          const bx = base.x + st.ox * s;
          const h = st.h * s;
          const tx = bx + sway * (0.85 + idx * 0.12);
          const ty = base.y - h;

          ctx.strokeStyle = st.col;
          ctx.lineWidth = st.thick * s;
          ctx.lineCap = 'round';
          ctx.beginPath();
          ctx.moveTo(bx, base.y);
          ctx.quadraticCurveTo(bx + sway * 0.35, base.y - h * 0.52, tx, ty);
          ctx.stroke();

          ctx.strokeStyle = st.hi;
          ctx.lineWidth = st.thick * 0.42 * s;
          ctx.beginPath();
          ctx.moveTo(bx - 0.7 * s, base.y);
          ctx.quadraticCurveTo(bx - 0.7 * s + sway * 0.35, base.y - h * 0.52, tx - 0.7 * s, ty);
          ctx.stroke();

          for (let k = 1; k <= 3; k++) {
            const tNode = k / 3.3;
            const nx = lerp(bx, tx, tNode);
            const ny = lerp(base.y, ty, tNode);
            ctx.fillStyle = '#1f3609';
            ctx.fillRect(nx - 2.0 * s, ny - 0.7 * s, 4.0 * s, 1.4 * s);

            const dir = (k + idx) % 2 === 0 ? 1 : -1;
            ctx.fillStyle = '#365314';
            ctx.beginPath();
            ctx.ellipse(nx + dir * 5.8 * s, ny - 1.1 * s, 6.8 * s, 1.8 * s, dir * -0.28, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#65a30d';
            ctx.beginPath();
            ctx.ellipse(nx + dir * 6.8 * s, ny - 2.8 * s, 7.4 * s, 1.9 * s, dir * -0.45, 0, Math.PI * 2);
            ctx.fill();
          }
        });
      } else if (t.variant === 'coconut_palm') {
        const h = 44 * s;
        const topX = base.x + 8.5 * s + sway;
        const topY = base.y - h;
        for (let seg = 0; seg < 7; seg++) {
          const t0 = seg / 7;
          const t1 = (seg + 1) / 7;
          const sx0 = lerp(base.x, topX, t0 * t0 * 0.32 + t0 * 0.68);
          const sy0 = lerp(base.y, topY, t0);
          const sx1 = lerp(base.x, topX, t1 * t1 * 0.32 + t1 * 0.68);
          const sy1 = lerp(base.y, topY, t1);
          ctx.strokeStyle = seg % 2 === 0 ? '#78350f' : '#92400e';
          ctx.lineWidth = (5.4 - seg * 0.38) * s;
          ctx.lineCap = 'round';
          ctx.beginPath();
          ctx.moveTo(sx0, sy0);
          ctx.lineTo(sx1, sy1);
          ctx.stroke();
        }
        [[-2.5, 2.8], [2.7, 3.0], [0.2, 4.4]].forEach(([cx, cy]) => {
          ctx.fillStyle = '#451a03';
          ctx.beginPath();
          ctx.arc(topX + cx * s, topY + cy * s, 2.9 * s, 0, Math.PI * 2);
          ctx.fill();
        });
        for (let f = 0; f < 7; f++) {
          const ang = (f / 7) * Math.PI * 2 + Math.sin(timeSec * 1.35 + t.phase) * 0.08;
          const fx = topX + Math.cos(ang) * 20 * s;
          const fy = topY + Math.sin(ang) * 10.5 * s + 5.5 * s;
          const mx = (topX + fx) * 0.5;
          const my = topY - 8.2 * s;
          ctx.strokeStyle = '#14532d';
          ctx.lineWidth = 3.6 * s;
          ctx.beginPath();
          ctx.moveTo(topX, topY);
          ctx.quadraticCurveTo(mx, my + 1.3 * s, fx, fy + 1.3 * s);
          ctx.stroke();

          ctx.strokeStyle = f % 2 === 0 ? '#16a34a' : '#22c55e';
          ctx.lineWidth = 2.4 * s;
          ctx.beginPath();
          ctx.moveTo(topX, topY);
          ctx.quadraticCurveTo(mx, my, fx, fy);
          ctx.stroke();
        }
      } else if (t.variant === 'kelp') {
        for (let k = -1; k <= 1; k++) {
          const kx = base.x + k * 5.8 * s;
          ctx.strokeStyle = k === 0 ? '#10b981' : '#047857';
          ctx.lineWidth = 3.8 * s;
          ctx.lineCap = 'round';
          ctx.beginPath();
          ctx.moveTo(kx, base.y);
          ctx.bezierCurveTo(
            kx - 7 * s + sway, base.y - 16 * s,
            kx + 8 * s - sway, base.y - 31 * s,
            kx + sway, base.y - 46 * s
          );
          ctx.stroke();
        }
      } else if (t.variant.startsWith('coral_')) {
        const colDeep = t.variant === 'coral_pink' ? '#be123c' : t.variant === 'coral_orange' ? '#c2410c' : '#6d28d9';
        const colMain = t.variant === 'coral_pink' ? '#fb7185' : t.variant === 'coral_orange' ? '#fb923c' : '#a855f7';
        const colTip = t.variant === 'coral_pink' ? '#ffe4e6' : t.variant === 'coral_orange' ? '#ffedd5' : '#f3e8ff';
        const branches = [
          [0, 0, 0, -19], [0, -9, -10, -21], [0, -11, 10, -22],
          [-5, -14, -13, -26], [5, -16, 13, -27]
        ];
        ctx.lineCap = 'round';
        branches.forEach(([x0, y0, x1, y1]) => {
          ctx.strokeStyle = colDeep;
          ctx.lineWidth = 4.8 * s;
          ctx.beginPath();
          ctx.moveTo(base.x + x0 * s, base.y + y0 * s + 1.3 * s);
          ctx.lineTo(base.x + x1 * s, base.y + y1 * s + 1.3 * s);
          ctx.stroke();

          ctx.strokeStyle = colMain;
          ctx.lineWidth = 3.2 * s;
          ctx.beginPath();
          ctx.moveTo(base.x + x0 * s, base.y + y0 * s);
          ctx.lineTo(base.x + x1 * s, base.y + y1 * s);
          ctx.stroke();

          ctx.fillStyle = colTip;
          ctx.beginPath();
          ctx.arc(base.x + x1 * s, base.y + y1 * s, 1.9 * s, 0, Math.PI * 2);
          ctx.fill();
        });
      } else if (t.variant === 'pine') {
        ctx.fillStyle = '#4a2e18';
        ctx.beginPath();
        ctx.moveTo(base.x - 4.2 * s, base.y);
        ctx.lineTo(base.x - 2.2 * s, base.y - 14 * s);
        ctx.lineTo(base.x + 2.2 * s, base.y - 14 * s);
        ctx.lineTo(base.x + 4.2 * s, base.y);
        ctx.closePath();
        ctx.fill();

        const tiers = [
          { yOff: 10, w: 17, h: 14, deep: '#143d24', mid: '#1b5e36', hi: '#2d8a50' },
          { yOff: 18, w: 14, h: 13, deep: '#164a2b', mid: '#217041', hi: '#38a162' },
          { yOff: 26, w: 11, h: 12, deep: '#195732', mid: '#28824c', hi: '#48b873' },
          { yOff: 33, w: 7.5, h: 11, deep: '#1e663b', mid: '#319659', hi: '#5ec987' }
        ];
        tiers.forEach((tr, i) => {
          const ty = base.y - tr.yOff * s;
          const rw = tr.w * s;
          const th = tr.h * s;
          const tipX = base.x + sway * (0.15 + i * 0.14);

          ctx.fillStyle = tr.deep;
          ctx.beginPath();
          ctx.moveTo(tipX, ty - th);
          ctx.lineTo(base.x - rw, ty + 1.8 * s);
          ctx.quadraticCurveTo(base.x, ty + 4.2 * s, base.x + rw, ty + 1.8 * s);
          ctx.closePath();
          ctx.fill();

          ctx.fillStyle = tr.mid;
          ctx.beginPath();
          ctx.moveTo(tipX, ty - th);
          ctx.lineTo(base.x - rw * 0.94, ty);
          ctx.quadraticCurveTo(base.x, ty + 2.2 * s, base.x + rw * 0.94, ty);
          ctx.closePath();
          ctx.fill();

          ctx.fillStyle = tr.hi;
          ctx.beginPath();
          ctx.moveTo(tipX, ty - th);
          ctx.lineTo(base.x - rw * 0.9, ty - 0.4 * s);
          ctx.lineTo(base.x - rw * 0.1, ty + 0.7 * s);
          ctx.closePath();
          ctx.fill();
        });
      } else if (t.variant === 'plum_blossom') {
        ctx.strokeStyle = '#4a2c18';
        ctx.lineWidth = 4.4 * s;
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(base.x, base.y);
        ctx.quadraticCurveTo(base.x - 2.5 * s, base.y - 11 * s, base.x + sway * 0.2, base.y - 21 * s);
        ctx.moveTo(base.x - 1 * s, base.y - 14 * s);
        ctx.lineTo(base.x - 8.5 * s, base.y - 20 * s);
        ctx.moveTo(base.x + 1 * s, base.y - 15 * s);
        ctx.lineTo(base.x + 8.5 * s, base.y - 20 * s);
        ctx.stroke();

        drawFoliagePuff(base.x - 9.5 * s + sway * 0.4, base.y - 22 * s, 9.8 * s, 8.2 * s, '#be185d', '#ec4899', '#f9a8d4');
        drawFoliagePuff(base.x + 9.5 * s + sway * 0.4, base.y - 21 * s, 9.8 * s, 8.2 * s, '#be185d', '#f43f5e', '#fda4af');
        drawFoliagePuff(base.x + sway * 0.5, base.y - 29 * s, 11.5 * s, 9.5 * s, '#db2777', '#f472b6', '#fce7f3');
      } else {
        ctx.fillStyle = '#4d2f18';
        ctx.beginPath();
        ctx.moveTo(base.x - 5 * s, base.y);
        ctx.quadraticCurveTo(base.x - 3 * s, base.y - 9.5 * s, base.x - 2.5 * s, base.y - 18 * s);
        ctx.lineTo(base.x + 2.5 * s, base.y - 18 * s);
        ctx.quadraticCurveTo(base.x + 3 * s, base.y - 9.5 * s, base.x + 5 * s, base.y);
        ctx.closePath();
        ctx.fill();

        ctx.fillStyle = '#754927';
        ctx.fillRect(base.x - 2.2 * s, base.y - 16 * s, 1.8 * s, 15 * s);

        const isGolden = t.variant === 'heartwood_sapling';
        const deepC = isGolden ? '#854d0e' : '#1b4d24';
        const midC = isGolden ? '#eab308' : '#358237';
        const hiC = isGolden ? '#fef08a' : '#65b849';

        drawFoliagePuff(base.x - 8.5 * s + sway * 0.35, base.y - 20 * s, 10.5 * s, 8.5 * s, deepC, midC, hiC);
        drawFoliagePuff(base.x + 8.5 * s + sway * 0.35, base.y - 20 * s, 10.5 * s, 8.5 * s, deepC, midC, hiC);
        drawFoliagePuff(base.x + sway * 0.5, base.y - 28 * s, 12.2 * s, 9.8 * s, deepC, midC, hiC);
      }

      ctx.restore();
    }

    function drawCustomProp(ctx, pr, originX, originY, tileW, cfg, timeSec, isNight) {
      ctx.save();
      const pos = isoProject(pr.gx, pr.gy, pr.gz, originX, originY, tileW);
      const s = pr.scale * (tileW / 40);

      if (pr.type === 'sandcastle') {
        ctx.fillStyle = '#d97706';
        ctx.fillRect(pos.x - 10 * s, pos.y - 8 * s, 20 * s, 8 * s);
        ctx.fillStyle = '#fbbf24';
        ctx.fillRect(pos.x - 11 * s, pos.y - 13 * s, 6 * s, 13 * s);
        ctx.fillRect(pos.x + 5 * s, pos.y - 13 * s, 6 * s, 13 * s);
        ctx.fillRect(pos.x - 4 * s, pos.y - 16 * s, 8 * s, 16 * s);
        ctx.fillStyle = '#ef4444';
        ctx.beginPath();
        ctx.moveTo(pos.x, pos.y - 21 * s);
        ctx.lineTo(pos.x + 6 * s, pos.y - 19 * s);
        ctx.lineTo(pos.x, pos.y - 17 * s);
        ctx.closePath();
        ctx.fill();
      } else if (pr.type === 'surfboard_rack') {
        const boards = [
          { ox: -5, col: '#0284c7', stripe: '#fef08a' },
          { ox: 0, col: '#f97316', stripe: '#ffffff' },
          { ox: 5, col: '#10b981', stripe: '#fde047' }
        ];
        boards.forEach((b) => {
          ctx.fillStyle = b.col;
          ctx.beginPath();
          ctx.ellipse(pos.x + b.ox * s, pos.y - 9 * s, 2.6 * s, 10 * s, 0.12, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = b.stripe;
          ctx.fillRect(pos.x + (b.ox - 1.5) * s, pos.y - 10 * s, 3 * s, 2 * s);
        });
      } else if (pr.type === 'giant_clam_pearl') {
        ctx.fillStyle = '#9d174d';
        ctx.beginPath();
        ctx.ellipse(pos.x, pos.y - 2 * s, 13 * s, 7.5 * s, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#f472b6';
        ctx.beginPath();
        ctx.arc(pos.x, pos.y - 6 * s, 11 * s, Math.PI * 1.1, Math.PI * 1.9);
        ctx.fill();
        const pearlGlow = ctx.createRadialGradient(pos.x, pos.y - 5 * s, 1, pos.x, pos.y - 5 * s, 12 * s);
        pearlGlow.addColorStop(0, '#ffffff');
        pearlGlow.addColorStop(0.5, 'rgba(186, 230, 253, 0.85)');
        pearlGlow.addColorStop(1, 'rgba(186, 230, 253, 0)');
        ctx.fillStyle = pearlGlow;
        ctx.beginPath();
        ctx.arc(pos.x, pos.y - 5 * s, 12 * s, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.arc(pos.x, pos.y - 5 * s, 4.2 * s, 0, Math.PI * 2);
        ctx.fill();
      } else if (pr.type === 'starfish_cluster') {
        const stars = [[-6, 1, '#fb7185'], [6, -1, '#fb923c'], [0, 3.5, '#facc15']];
        stars.forEach(([ox, oy, col]) => {
          ctx.fillStyle = col;
          ctx.beginPath();
          for (let i = 0; i < 5; i++) {
            const a1 = (i * 2 * Math.PI) / 5 - Math.PI / 2;
            const a2 = a1 + Math.PI / 5;
            const r1 = 6.2 * s;
            const r2 = 2.4 * s;
            const x1 = pos.x + ox * s + Math.cos(a1) * r1;
            const y1 = pos.y + oy * s + Math.sin(a1) * r1 * 0.65;
            const x2 = pos.x + ox * s + Math.cos(a2) * r2;
            const y2 = pos.y + oy * s + Math.sin(a2) * r2 * 0.65;
            if (i === 0) ctx.moveTo(x1, y1);
            else ctx.lineTo(x1, y1);
            ctx.lineTo(x2, y2);
          }
          ctx.closePath();
          ctx.fill();
          ctx.strokeStyle = '#fffbeb';
          ctx.lineWidth = 0.8 * s;
          ctx.stroke();
        });
      } else if (pr.type === 'flower_patch') {
        const colors = ['#f43f5e', '#facc15', '#a855f7', '#fb923c', '#38bdf8'];
        ctx.fillStyle = '#2d6a32';
        ctx.beginPath();
        ctx.ellipse(pos.x, pos.y, 13 * s, 6.8 * s, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#4ade80';
        ctx.beginPath();
        ctx.ellipse(pos.x - 1 * s, pos.y - 1 * s, 11 * s, 5.4 * s, 0, 0, Math.PI * 2);
        ctx.fill();
        for (let i = 0; i < 6; i++) {
          const ang = i * 1.05;
          const fx = pos.x + Math.cos(ang) * 7.2 * s;
          const fy = pos.y + Math.sin(ang) * 3.4 * s - 1.5 * s;
          ctx.fillStyle = colors[i % colors.length];
          ctx.beginPath();
          ctx.arc(fx, fy, 2.2 * s, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = '#fef9c3';
          ctx.beginPath();
          ctx.arc(fx, fy, 0.85 * s, 0, Math.PI * 2);
          ctx.fill();
        }
      } else if (pr.type === 'fern_tuft' || pr.type === 'hibiscus') {
        ctx.fillStyle = '#15803d';
        ctx.beginPath();
        ctx.arc(pos.x - 4 * s, pos.y - 3 * s, 5.5 * s, 0, Math.PI * 2);
        ctx.arc(pos.x + 4 * s, pos.y - 3 * s, 5.5 * s, 0, Math.PI * 2);
        ctx.arc(pos.x, pos.y - 6 * s, 6 * s, 0, Math.PI * 2);
        ctx.fill();
        if (pr.type === 'hibiscus') {
          ctx.fillStyle = '#f43f5e';
          ctx.beginPath();
          ctx.arc(pos.x - 3 * s, pos.y - 6 * s, 2.5 * s, 0, Math.PI * 2);
          ctx.arc(pos.x + 3.5 * s, pos.y - 5 * s, 2.3 * s, 0, Math.PI * 2);
          ctx.fill();
        }
      } else if (pr.type === 'bamboo_fence') {
        ctx.strokeStyle = '#78350f';
        ctx.lineWidth = 2.4 * s;
        [-8, 0, 8].forEach((ox) => {
          ctx.beginPath();
          ctx.moveTo(pos.x + ox * s, pos.y);
          ctx.lineTo(pos.x + ox * s, pos.y - 10 * s);
          ctx.stroke();
        });
        ctx.strokeStyle = '#a16207';
        ctx.lineWidth = 1.8 * s;
        ctx.beginPath();
        ctx.moveTo(pos.x - 10 * s, pos.y - 7 * s);
        ctx.lineTo(pos.x + 10 * s, pos.y - 7 * s);
        ctx.moveTo(pos.x - 10 * s, pos.y - 3.5 * s);
        ctx.lineTo(pos.x + 10 * s, pos.y - 3.5 * s);
        ctx.stroke();
      } else if (pr.type === 'wooden_bench') {
        drawIsoPrism(ctx, pr.gx, pr.gy, pr.gz, 0.72, 0.34, 0.24, '#d97706', '#92400e', '#78350f', originX, originY, tileW);
      } else if (pr.type === 'supply_crates') {
        drawIsoPrism(ctx, pr.gx - 0.14, pr.gy, pr.gz, 0.34, 0.34, 0.32, '#eab308', '#b45309', '#78350f', originX, originY, tileW, '#451a03');
        drawIsoPrism(ctx, pr.gx + 0.18, pr.gy + 0.1, pr.gz, 0.28, 0.28, 0.24, '#f59e0b', '#92400e', '#78350f', originX, originY, tileW, '#451a03');
      } else if (pr.type === 'beach_umbrella') {
        drawIsoPrism(ctx, pr.gx - 0.12, pr.gy + 0.15, pr.gz, 0.45, 0.25, 0.12, '#ffffff', '#e2e8f0', '#cbd5e1', originX, originY, tileW);
        ctx.strokeStyle = '#fef3c7';
        ctx.lineWidth = 2 * s;
        ctx.beginPath();
        ctx.moveTo(pos.x, pos.y);
        ctx.lineTo(pos.x + 2 * s, pos.y - 16 * s);
        ctx.stroke();
        ctx.fillStyle = '#0284c7';
        ctx.beginPath();
        ctx.arc(pos.x + 2 * s, pos.y - 15 * s, 11 * s, Math.PI, 0);
        ctx.fill();
        ctx.fillStyle = '#fef08a';
        ctx.beginPath();
        ctx.arc(pos.x + 2 * s, pos.y - 15 * s, 5 * s, Math.PI, 0);
        ctx.fill();
      } else if (pr.type === 'zen_rock_cluster') {
        ctx.fillStyle = '#cbd5e1';
        ctx.beginPath();
        ctx.ellipse(pos.x, pos.y - 2 * s, 12 * s, 6.5 * s, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#64748b';
        ctx.beginPath();
        ctx.arc(pos.x - 3 * s, pos.y - 5 * s, 5 * s, 0, Math.PI * 2);
        ctx.arc(pos.x + 4 * s, pos.y - 4 * s, 3.8 * s, 0, Math.PI * 2);
        ctx.fill();
      } else if (pr.type === 'koi_pond') {
        const pondGrad = ctx.createRadialGradient(pos.x - 5 * s, pos.y - 3 * s, 3 * s, pos.x, pos.y, 26 * s);
        pondGrad.addColorStop(0, '#38bdf8');
        pondGrad.addColorStop(0.7, '#0284c7');
        pondGrad.addColorStop(1, '#0c4a6e');
        ctx.fillStyle = pondGrad;
        ctx.beginPath();
        ctx.ellipse(pos.x, pos.y, 26 * s, 14 * s, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = '#bae6fd';
        ctx.lineWidth = 1.6;
        ctx.stroke();

        for (let k = 0; k < 2; k++) {
          const kAng = timeSec * (1.25 + k * 0.35) + k * 3.1;
          const kx = pos.x + Math.cos(kAng) * (11 - k * 3) * s;
          const ky = pos.y + Math.sin(kAng) * (5.0 - k * 1.1) * s;
          ctx.fillStyle = k === 0 ? '#f97316' : '#ffffff';
          ctx.beginPath();
          ctx.ellipse(kx, ky, 4.5 * s, 2.1 * s, kAng + Math.PI * 0.5, 0, Math.PI * 2);
          ctx.fill();
        }
      } else if (pr.type === 'shishi_odoshi') {
        const cycle = (timeSec * 0.72) % 1;
        const tilt = cycle > 0.75 ? Math.sin(((cycle - 0.75) / 0.25) * Math.PI) * 0.88 : -0.25;
        ctx.strokeStyle = '#78350f';
        ctx.lineWidth = 3.0 * s;
        ctx.beginPath();
        ctx.moveTo(pos.x - 5 * s, pos.y);
        ctx.lineTo(pos.x - 5 * s, pos.y - 14 * s);
        ctx.stroke();
        ctx.save();
        ctx.translate(pos.x - 5 * s, pos.y - 13 * s);
        ctx.rotate(tilt);
        ctx.fillStyle = '#84cc16';
        ctx.fillRect(-10 * s, -2.4 * s, 21 * s, 4.8 * s);
        ctx.restore();
        if (cycle > 0.76 && cycle < 0.95) {
          ctx.strokeStyle = '#7dd3fc';
          ctx.lineWidth = 2.2 * s;
          ctx.beginPath();
          ctx.moveTo(pos.x + 7 * s, pos.y - 4 * s);
          ctx.lineTo(pos.x + 12 * s, pos.y + 8 * s);
          ctx.stroke();
        }
      } else if (pr.type === 'toro_lantern' || pr.type === 'streetlight') {
        ctx.fillStyle = '#94a3b8';
        ctx.fillRect(pos.x - 2.8 * s, pos.y - 16 * s, 5.6 * s, 16 * s);
        const glowRadius = (isNight ? 20 : 12) * s;
        const glow = ctx.createRadialGradient(pos.x, pos.y - 18 * s, 1, pos.x, pos.y - 18 * s, glowRadius);
        glow.addColorStop(0, 'rgba(254, 240, 138, 0.98)');
        glow.addColorStop(1, 'rgba(254, 240, 138, 0)');
        ctx.fillStyle = glow;
        ctx.beginPath();
        ctx.arc(pos.x, pos.y - 18 * s, glowRadius, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#fef08a';
        ctx.fillRect(pos.x - 3.8 * s, pos.y - 21 * s, 7.6 * s, 5.5 * s);
        ctx.fillStyle = '#64748b';
        ctx.beginPath();
        ctx.moveTo(pos.x, pos.y - 28 * s);
        ctx.lineTo(pos.x - 8.5 * s, pos.y - 21 * s);
        ctx.lineTo(pos.x + 8.5 * s, pos.y - 21 * s);
        ctx.closePath();
        ctx.fill();
      } else if (pr.type === 'torii_gate') {
        ctx.fillStyle = '#dc2626';
        ctx.fillRect(pos.x - 12 * s, pos.y - 26 * s, 3.8 * s, 26 * s);
        ctx.fillRect(pos.x + 8.5 * s, pos.y - 26 * s, 3.8 * s, 26 * s);
        ctx.fillRect(pos.x - 16 * s, pos.y - 21 * s, 32 * s, 3.2 * s);
        ctx.fillStyle = '#1e293b';
        ctx.fillRect(pos.x - 19 * s, pos.y - 29 * s, 38 * s, 4.2 * s);
      } else if (pr.type === 'red_arch_bridge' || pr.type === 'canal_arch_bridge' || pr.type === 'stone_arch_bridge') {
        const isCanal = pr.type === 'canal_arch_bridge';
        const col = pr.type === 'red_arch_bridge' ? '#dc2626' : isCanal ? '#92400e' : '#94a3b8';
        const deckCol = isCanal ? '#b45309' : col;
        const railCol = isCanal ? '#fef3c7' : 'rgba(255,255,255,0.55)';

        if (isCanal) {
          [-22 * s, 22 * s].forEach((ox) => {
            ctx.fillStyle = '#5c280b';
            ctx.fillRect(pos.x + ox - 3.2 * s, pos.y - 2 * s, 6.4 * s, 11 * s);
            ctx.fillStyle = 'rgba(15, 118, 110, 0.45)';
            ctx.beginPath();
            ctx.ellipse(pos.x + ox, pos.y + 8 * s, 5.5 * s, 2.2 * s, 0, 0, Math.PI * 2);
            ctx.fill();
          });
        }

        ctx.strokeStyle = 'rgba(6, 78, 59, 0.35)';
        ctx.lineWidth = 7 * s;
        ctx.beginPath();
        ctx.arc(pos.x, pos.y + 8 * s, 24 * s, Math.PI * 1.14, Math.PI * 1.86);
        ctx.stroke();

        ctx.strokeStyle = col;
        ctx.lineWidth = 7.5 * s;
        ctx.beginPath();
        ctx.arc(pos.x, pos.y + 5 * s, 24 * s, Math.PI * 1.14, Math.PI * 1.86);
        ctx.stroke();

        ctx.strokeStyle = deckCol;
        ctx.lineWidth = 3.2 * s;
        ctx.beginPath();
        ctx.arc(pos.x, pos.y + 3.2 * s, 24 * s, Math.PI * 1.14, Math.PI * 1.86);
        ctx.stroke();

        ctx.strokeStyle = railCol;
        ctx.lineWidth = 1.4 * s;
        ctx.beginPath();
        ctx.arc(pos.x, pos.y - 1.2 * s, 24 * s, Math.PI * 1.15, Math.PI * 1.85);
        ctx.stroke();
      } else if (pr.type === 'crystal_cluster') {
        const cols = ['#38bdf8', '#c084fc', '#fb923c'];
        cols.forEach((col, idx) => {
          const ox = (idx - 1) * 5.8 * s;
          const h = (18 + (idx % 2) * 8) * s;
          const cGrad = ctx.createLinearGradient(pos.x + ox, pos.y - h, pos.x + ox, pos.y);
          cGrad.addColorStop(0, '#ffffff');
          cGrad.addColorStop(0.35, col);
          cGrad.addColorStop(1, '#1e1b4b');
          ctx.fillStyle = cGrad;
          ctx.beginPath();
          ctx.moveTo(pos.x + ox, pos.y - h);
          ctx.lineTo(pos.x + ox - 4.4 * s, pos.y);
          ctx.lineTo(pos.x + ox + 4.4 * s, pos.y);
          ctx.closePath();
          ctx.fill();
        });
      } else if (pr.type === 'campfire') {
        ctx.fillStyle = '#78350f';
        ctx.fillRect(pos.x - 9 * s, pos.y - 2 * s, 18 * s, 4 * s);
        const flicker = Math.sin(timeSec * 13) * 2.4 * s;
        const fireGlow = ctx.createRadialGradient(pos.x, pos.y - 7 * s, 2, pos.x, pos.y - 7 * s, (isNight ? 24 : 17) * s);
        fireGlow.addColorStop(0, 'rgba(251, 146, 60, 0.78)');
        fireGlow.addColorStop(1, 'rgba(251, 146, 60, 0)');
        ctx.fillStyle = fireGlow;
        ctx.beginPath();
        ctx.arc(pos.x, pos.y - 7 * s, (isNight ? 24 : 17) * s, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#f97316';
        ctx.beginPath();
        ctx.moveTo(pos.x, pos.y - 18 * s - flicker);
        ctx.lineTo(pos.x - 7 * s, pos.y - 2 * s);
        ctx.lineTo(pos.x + 7 * s, pos.y - 2 * s);
        ctx.closePath();
        ctx.fill();
        ctx.fillStyle = '#fde047';
        ctx.beginPath();
        ctx.arc(pos.x, pos.y - 6 * s, 4 * s, 0, Math.PI * 2);
        ctx.fill();
      } else if (pr.type === 'wooden_pier') {
        ctx.fillStyle = '#92400e';
        ctx.beginPath();
        ctx.moveTo(pos.x - 10 * s, pos.y - 5 * s);
        ctx.lineTo(pos.x + 18 * s, pos.y + 8 * s);
        ctx.lineTo(pos.x + 10 * s, pos.y + 12 * s);
        ctx.lineTo(pos.x - 18 * s, pos.y - 1 * s);
        ctx.closePath();
        ctx.fill();
        ctx.strokeStyle = '#fef3c7';
        ctx.lineWidth = 1;
        ctx.stroke();
      } else if (pr.type === 'glow_mushroom') {
        ctx.fillStyle = '#fef3c7';
        ctx.fillRect(pos.x - 2 * s, pos.y - 8 * s, 4 * s, 8 * s);
        const mGlow = ctx.createRadialGradient(pos.x, pos.y - 9 * s, 2, pos.x, pos.y - 9 * s, (isNight ? 18 : 12) * s);
        mGlow.addColorStop(0, 'rgba(56, 189, 248, 0.92)');
        mGlow.addColorStop(1, 'rgba(56, 189, 248, 0)');
        ctx.fillStyle = mGlow;
        ctx.beginPath();
        ctx.arc(pos.x, pos.y - 9 * s, (isNight ? 18 : 12) * s, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#38bdf8';
        ctx.beginPath();
        ctx.arc(pos.x, pos.y - 8.5 * s, 7 * s, Math.PI, 0);
        ctx.fill();
      } else if (pr.type === 'solar_array') {
        ctx.fillStyle = '#1d4ed8';
        ctx.beginPath();
        ctx.moveTo(pos.x - 15 * s, pos.y - 13 * s);
        ctx.lineTo(pos.x + 11 * s, pos.y - 20 * s);
        ctx.lineTo(pos.x + 17 * s, pos.y - 7 * s);
        ctx.lineTo(pos.x - 9 * s, pos.y);
        ctx.closePath();
        ctx.fill();
        ctx.strokeStyle = '#93c5fd';
        ctx.lineWidth = 1.3;
        ctx.stroke();
      } else if (pr.type === 'skytrain_viaduct') {
        const vL = isoProject(-3.5, pr.gy, pr.gz, originX, originY, tileW);
        const vR = isoProject(3.5, pr.gy, pr.gz, originX, originY, tileW);
        ctx.strokeStyle = '#94a3b8';
        ctx.lineWidth = 7.5 * s;
        ctx.beginPath();
        ctx.moveTo(vL.x, vL.y);
        ctx.lineTo(vR.x, vR.y);
        ctx.stroke();
        ctx.strokeStyle = '#e2e8f0';
        ctx.lineWidth = 3.8 * s;
        ctx.beginPath();
        ctx.moveTo(vL.x, vL.y - 1.4 * s);
        ctx.lineTo(vR.x, vR.y - 1.4 * s);
        ctx.stroke();
      } else if (pr.type === 'market_lantern') {
        ctx.strokeStyle = '#78350f';
        ctx.lineWidth = 2.4 * s;
        ctx.beginPath();
        ctx.moveTo(pos.x, pos.y);
        ctx.lineTo(pos.x, pos.y - 20 * s);
        ctx.stroke();
        const lRadius = (isNight ? 20 : 12) * s;
        const lGlow = ctx.createRadialGradient(pos.x, pos.y - 17 * s, 1, pos.x, pos.y - 17 * s, lRadius);
        lGlow.addColorStop(0, 'rgba(253, 224, 71, 0.96)');
        lGlow.addColorStop(1, 'rgba(253, 224, 71, 0)');
        ctx.fillStyle = lGlow;
        ctx.beginPath();
        ctx.arc(pos.x, pos.y - 17 * s, lRadius, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#fde047';
        ctx.beginPath();
        ctx.arc(pos.x, pos.y - 17 * s, 4.6 * s, 0, Math.PI * 2);
        ctx.fill();
      } else {
